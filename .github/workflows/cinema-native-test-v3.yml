name: Build MusicFlow Cinema Native TEST v3 APK
on:
  push:
    branches: ["feature/musicflow-cinema-native-sources-test-v3"]
    paths:
      - ".github/workflows/cinema-native-test-v3.yml"
      - "app/src/main/java/com/musicflow/app/Cinema*.kt"
      - "app/src/test/java/com/musicflow/app/Cinema*.kt"
      - "app/src/main/assets/cinema_lab_demo.json"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
      - "cinema-test/native-demo.m3u"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK and offline video encoder
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Generate local offline Media3 test clip
        shell: bash
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'testsrc2=size=320x180:rate=12' \
            -f lavfi -i 'sine=frequency=440:sample_rate=44100' \
            -t 8 -c:v libx264 -preset veryfast -crf 27 -pix_fmt yuv420p \
            -c:a aac -b:a 64k -movflags +faststart -shortest \
            app/src/main/assets/cinema_lab_test.mp4
          test "$(stat -c %s app/src/main/assets/cinema_lab_test.mp4)" -gt 15000
      - name: Assert no Lampa window, native player, separate package and working M3U demo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          gradle=Path("app/build.gradle.kts").read_text()
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          screen=Path("app/src/main/java/com/musicflow/app/CinemaLabScreen.kt").read_text()
          native=Path("app/src/main/java/com/musicflow/app/CinemaNativeSources.kt").read_text()
          player=Path("app/src/main/java/com/musicflow/app/CinemaNativeInlinePlayer.kt").read_text()
          demo=json.loads(Path("app/src/main/assets/cinema_lab_demo.json").read_text())
          m3u=Path("cinema-test/native-demo.m3u").read_text()
          assert 'applicationIdSuffix = ".cinematest3"' in gradle
          assert 'android:label="MusicFlow Кино Native TEST"' in manifest
          assert 'CinemaNativeInlinePlayer(' in screen
          assert 'CinemaNativeSourcesDialog(' in screen
          assert 'CinemaLampaWebScreen(' not in screen
          assert not Path("app/src/main/java/com/musicflow/app/CinemaLampaWebScreen.kt").exists()
          assert 'AndroidView(' in player and 'ExoPlayer.Builder(' in player
          assert 'CINEMA_JSON, M3U_PLAYLIST, DIRECT_MEDIA, LAMPA_REFERENCE' in native
          assert 'instanceFollowRedirects = false' in native
          assert 'CinemaSourceFormat.LAMPA_REFERENCE -> emptyList()' in native
          assert demo["items"][0]["stream_url"] == "asset:///cinema_lab_test.mp4"
          assert m3u.startswith("#EXTM3U") and "#EXTINF" in m3u
          assert Path("app/src/main/assets/cinema_lab_test.mp4").stat().st_size > 15000
          print("PASS: in-page Media3, native source adapters, isolated package, no external Lampa window")
          PY
      - name: Run source parser and Media3 compatibility unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build native Cinema debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify independent package, signature, embedded offline video
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview.cinematest3'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/cinema_lab_test.mp4'
          mkdir -p dist
          cp "$APK" dist/MusicFlow-Cinema-Native-TEST-v3.apk
          sha256sum dist/MusicFlow-Cinema-Native-TEST-v3.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-Cinema-Native-TEST-v3-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error
