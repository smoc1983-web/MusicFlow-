name: Publish MusicFlow 0.7.49 original-key Compact Glass update
on:
  push:
    branches: ["feature/musicflow-v0749-compact-radio-official"]
    paths:
      - ".github/release-assets/v0749/signed-delta.doublezstd.b64"
permissions:
  contents: write
  actions: read
concurrency:
  group: official-musicflow-v0749
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare APK signature verification
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update -qq && sudo apt-get install -y zstd; }
          yes | sdkmanager "build-tools;36.0.0" >/dev/null ||
            test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Download tested original unsigned APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/release-assets/v0749/checksums.env
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 45116005390 -R "$GITHUB_REPOSITORY" \
            -n MusicFlow-0.7.49-unsigned-and-signing-tools \
            --dir "$RUNNER_TEMP/unsigned"
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.49-aligned-unsigned.apk"
          echo "$UNSIGNED_SHA  $UNSIGNED" | sha256sum -c -
          SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45116005390" \
            --jq '.head_sha')
          test "$SOURCE" = "$SOURCE_SHA" || {
            echo "::error::Signed APK source mismatch."
            exit 1
          }
      - name: Reconstruct privately signed release from nonsecret signed-byte delta
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-assets/v0749/checksums.env
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.49-aligned-unsigned.apk"
          OUTER="$RUNNER_TEMP/signed-delta.doublezstd"
          PATCH="$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          base64 -d .github/release-assets/v0749/signed-delta.doublezstd.b64 > "$OUTER"
          echo "$OUTER_SHA  $OUTER" | sha256sum -c -
          zstd -q -d "$OUTER" -o "$PATCH"
          echo "$PATCH_SHA  $PATCH" | sha256sum -c -
          zstd -q -d --patch-from="$UNSIGNED" "$PATCH" \
            -o out/MusicFlow_0.7.49.apk
          echo "$SIGNED_SHA  out/MusicFlow_0.7.49.apk" | sha256sum -c -
      - name: Verify unchanged app identity and release certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.49.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          "$TOOLS/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='749' versionName='0.7.49'"
          CERT=$("$TOOLS/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$CERT" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" ||
            { echo "::error::Wrong signing certificate"; exit 1; }
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish official 0.7.49 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.49 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v0.7.49 already exists; refusal to overwrite"
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          MusicFlow 0.7.49 — Compact Glass и все исправления последней тестовой версии.

          - Радио-плеер: выбранный стиль №2 Compact Glass. Вместо пустого полноэкранного экрана — компактная стеклянная карточка с обложкой слева, названием и состоянием станции справа.
          - Управление радио: Play/Pause, избранное, эквалайзер, закрытие и сворачивание. Нет перемотки, повтора и переключения несуществующих треков.
          - Радио: читаемая монограмма для отсутствующего логотипа, оригинальная обложка при наличии.
          - Эквалайзер внутри музыки, радио, ТВ и кино, включая независимый PCM видеоплеер.
          - Кино: меню выбора реальных аудиодорожек; при одной дорожке объясняет отсутствие альтернативы.
          - Исправлена прокрутка кино и поиска из тестовой версии 0.7.47.
          - Сохранены пять тем Liquid Glass, увеличенный IPTV-буфер и обновлятор.

          Официальный пакет com.musicflow.preview, versionCode 749, версия 0.7.49.
          Прежний сертификат подписи MusicFlow: установка поверх 0.7.46 без удаления и потери данных. Проверяйте обновления в меню «О приложении» MusicFlow.
          Работа отдельных потоков и наличие озвучки зависят от внешних источников; Bluetooth-аудио требует проверки на устройстве.

          NOTES
          gh release create v0.7.49 out/MusicFlow_0.7.49.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "MusicFlow 0.7.49 · Compact Glass, кино и эквалайзер" \
            --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.49" \
            --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.49.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.49-official-signed
          path: |
            out/MusicFlow_0.7.49.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
