name: Publish MusicFlow 0.7.36 verified locally signed update
on:
  push:
    branches: ["feature/musicflow-v0.7.36-home-charts-ru"]
    paths: [".github/release-assets/v0736/unsigned-to-signed.patch.zst.b64"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: musicflow-v0736-offline-verified
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release manifests and signed delta
        uses: actions/checkout@v4
      - name: Prepare zstd and Android build tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          yes | sdkmanager "build-tools;36.0.0" >/dev/null || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Retrieve exactly validated unsigned APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 44937777515 -R "$GITHUB_REPOSITORY" \
            -n MusicFlow-0.7.36-aligned-unsigned --dir "$RUNNER_TEMP/unsigned"
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.36-aligned-unsigned.apk"
          echo "UNSIGNED_SHA256_PENDING  $UNSIGNED" | sha256sum -c -
      - name: Reconstruct signed APK without uploading signing credentials
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          base64 -d .github/release-assets/v0736/unsigned-to-signed.patch.zst.b64 > "$PATCH"
          echo "PATCH_SHA256_PENDING  $PATCH" | sha256sum -c -
          zstd -q -d \
            --patch-from="$RUNNER_TEMP/unsigned/MusicFlow_0.7.36-aligned-unsigned.apk" \
            "$PATCH" -o out/MusicFlow_0.7.36.apk
          echo "SIGNED_SHA256_PENDING  out/MusicFlow_0.7.36.apk" | sha256sum -c -
      - name: Validate signed package, version, archive and stable certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.36.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -c -p 4 "$APK"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.musicflow.preview' versionCode='736' versionName='0.7.36'"
          FINGERPRINT=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$FINGERPRINT" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410"
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish GitHub release for in-app updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.36 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v0.7.36 already exists; refusing to overwrite."
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          MusicFlow 0.7.36 — Россия и мир в главном ТОПе песен.

          - Раздел «ТОП песен» перенесён на главную страницу рядом с «Популярное» и «Новинки» вместо заголовка «Музыкальная лента».
          - Доступны переключатели Россия / Мир и Неделя / Месяц / Год.
          - Российские позиции — наблюдения UpSound AI за чартом Яндекс Музыки. Число в карточке означает сумму дневных слушателей в попавшие в чарт дни; годовой архив неполный.
          - Мировые позиции — зарегистрированные прослушивания ListenBrainz, не все стриминговые сервисы.
          - Нажатие на композицию ищет точную запись в подключённых источниках MusicFlow.
          - Сохранены исправления прокрутки поиска и убранная нижняя кнопка «Другой источник».
          - Версия 0.7.36 (versionCode 736); идентификатор com.musicflow.preview и прежний сертификат подписи сохранены.

          Через приложение: «О приложении» → «Проверить обновления» → «Скачать и установить».
          Источники чартов могут быть недоступны; доступность конкретного аудиопотока не гарантируется. На Samsung S24 нужна проверка установки.
          Подпись APK и SHA-256 проверяются в CI. Приватный ключ и пароли в GitHub не передаются.
          NOTES
          gh release create v0.7.36 out/MusicFlow_0.7.36.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MusicFlow 0.7.36 · Российский и мировой ТОП на главной" \
            --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.36" \
            --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.36.apk'
      - name: Save verified signed APK to CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.36-official-signed
          path: |
            out/MusicFlow_0.7.36.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
