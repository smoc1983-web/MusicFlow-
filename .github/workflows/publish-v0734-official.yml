name: Publish MusicFlow 0.7.34 signed in-app update
on:
  push:
    branches: ["feature/musicflow-v0.7.34-radio-label"]
    paths: [".github/workflows/publish-v0734-official.yml"]

permissions:
  contents: write
concurrency:
  group: musicflow-official-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out selected application source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Verify version, package ID and release tag
        id: release_identity
        shell: bash
        env:
          EVENT_REF_TYPE: ${{ github.ref_type }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FILE=app/build.gradle.kts
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' "$FILE" | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' "$FILE" | head -1)"
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "::error::Expected semantic versionName."; exit 1; }
          MAJOR=${BASH_REMATCH[1]}
          MINOR=${BASH_REMATCH[2]}
          PATCH=${BASH_REMATCH[3]}
          (( MINOR < 100 && PATCH < 100 )) || { echo "::error::Unsupported semver range."; exit 1; }
          EXPECTED_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          test "$VERSION_CODE" = "$EXPECTED_CODE" || { echo "::error::versionCode is not derived from versionName."; exit 1; }
          grep -F 'applicationId = "com.musicflow.preview"' "$FILE"
          test -s .github/signing/MusicFlow_signing_release.jks.enc.b64
          if [[ "$EVENT_REF_TYPE" == "tag" ]]; then
            test "$EVENT_REF_NAME" = "v$VERSION" || { echo "::error::Git tag does not match app version."; exit 1; }
          fi
          test "$VERSION" = "0.7.34" && test "$VERSION_CODE" = "734" || { echo "::error::This workflow publishes only MusicFlow 0.7.34."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reject accidental overwrite of published APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_identity.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Never silently replace a signed APK."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Reconfirm ub-mode regression and Kotlin unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_v0734.py
          python3 scripts/verify_v0733.py
          gradle --no-daemon :app:testDebugUnitTest

      - name: Restore ORIGINAL signing key from encrypted backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.MUSICFLOW_SIGNING_BACKUP_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.MUSICFLOW_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSICFLOW_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSICFLOW_SIGNING_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$BACKUP_PASSPHRASE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing signing secrets. Add all four MUSICFLOW_SIGNING_* secrets in Settings > Secrets and variables > Actions."
            exit 1
          fi
          umask 077
          base64 -d .github/signing/MusicFlow_signing_release.jks.enc.b64 > "$RUNNER_TEMP/musicflow-release.jks.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 350000 \
            -in "$RUNNER_TEMP/musicflow-release.jks.enc" \
            -out "$RUNNER_TEMP/musicflow-release.jks" \
            -pass env:BACKUP_PASSPHRASE
          chmod 600 "$RUNNER_TEMP/musicflow-release.jks"
          test "$KEY_ALIAS" = "musicflow"
          ACTUAL=$(keytool -list -v -keystore "$RUNNER_TEMP/musicflow-release.jks" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" |
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 |
            tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" || {
            echo "::error::The signing certificate does not match the installed MusicFlow updates."
            exit 1
          }
          echo "MUSICFLOW_SIGNING_KEYSTORE=$RUNNER_TEMP/musicflow-release.jks" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Compile official signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signer matches stable 0.7.25 and package/version are compatible
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release_identity.outputs.version }}
          RELEASE_CODE: ${{ steps.release_identity.outputs.version_code }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='$RELEASE_CODE' versionName='$RELEASE_VERSION'"
          NEW_SIGNER=$("$SIGNER" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$NEW_SIGNER" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" || {
            echo "::error::APK signer differs from the original permanent MusicFlow release signer."
            exit 1
          }
          mkdir -p out
          cp "$APK" "out/MusicFlow_$RELEASE_VERSION.apk"
          sha256sum "out/MusicFlow_$RELEASE_VERSION.apk" > out/SHA256SUMS.txt

      - name: Publish release to MusicFlow in-app update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release_identity.outputs.version }}
          RELEASE_TAG: ${{ steps.release_identity.outputs.tag }}
          SOURCE_SHA: ${{ steps.release_identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "out/MusicFlow_$RELEASE_VERSION.apk" out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" \
            --title "MusicFlow $RELEASE_VERSION · Радио и улучшения плеера" \
            --notes "Официальное обновление MusicFlow 0.7.34: вкладка «Радио», таймер сна, статистика прослушивания, улучшенное восстановление очереди и фоновое воспроизведение. Обновление совместимо с постоянным ключом подписи и устанавливается через меню приложения. Не удаляйте предыдущую версию. После загрузки подтвердите установку в Android. Проверки CI пройдены; отдельное тестирование на Samsung S24 остаётся необходимым."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets[].name' | grep -Fx "MusicFlow_$RELEASE_VERSION.apk"

      - name: Keep signed APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-official-signed-release
          path: |
            out/*.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
