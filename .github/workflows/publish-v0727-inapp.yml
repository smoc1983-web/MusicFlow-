name: Publish MusicFlow 0.7.27 in-app update
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: musicflow-publish-0727
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK and build tools
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify updater source contract
        run: python3 scripts/verify_v0727.py
      - name: Restore original signing key from encrypted repository backup
        env:
          BACKUP_PASSPHRASE: ${{ secrets.MUSICFLOW_SIGNING_BACKUP_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.MUSICFLOW_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSICFLOW_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSICFLOW_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$BACKUP_PASSPHRASE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Set all four signing secrets before releasing. See SIGNING_RECOVERY_RU.md. Never commit passwords or the plaintext JKS."
            exit 1
          fi
          umask 077
          base64 -d .github/signing/MusicFlow_signing_release.jks.enc.b64 > "$RUNNER_TEMP/musicflow-release.jks.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 350000 \
            -in "$RUNNER_TEMP/musicflow-release.jks.enc" \
            -out "$RUNNER_TEMP/musicflow-release.jks" \
            -pass env:BACKUP_PASSPHRASE
          chmod 600 "$RUNNER_TEMP/musicflow-release.jks"
          ACTUAL=$(keytool -list -v -keystore "$RUNNER_TEMP/musicflow-release.jks" \
            -storepass:env STORE_PASSWORD | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410"
          test "$KEY_ALIAS" = "musicflow"
          echo "Original MusicFlow signing certificate verified."
          echo "MUSICFLOW_SIGNING_KEYSTORE=$RUNNER_TEMP/musicflow-release.jks" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Compile signed 0.7.27 APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Check version, package and identical permanent signer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -s "$APK"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.musicflow.preview' versionCode='727' versionName='0.7.27'"
          curl -fLsS --retry 2 --connect-timeout 15 --max-time 120             "https://github.com/smoc1983-web/MusicFlow-/releases/download/v0.7.25/MusicFlow_0.7.25.apk"             -o "$RUNNER_TEMP/musicflow-0725.apk"
          BASE_SIGNER=$("$SIGNER" verify --print-certs "$RUNNER_TEMP/musicflow-0725.apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          NEW_SIGNER=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test -n "$BASE_SIGNER"
          test "$BASE_SIGNER" = "$NEW_SIGNER"
          echo "Same package, greater version and same permanent signer: confirmed."
          mkdir -p out
          cp "$APK" out/MusicFlow_0.7.27.apk
      - name: Publish signed update to the exact feed consumed by MusicFlow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.27 >/dev/null 2>&1; then
            echo "::error::v0.7.27 already published. Refuse to replace a signed release."
            exit 1
          fi
          gh release create v0.7.27 out/MusicFlow_0.7.27.apk             --target "$GITHUB_SHA" --title "MusicFlow 0.7.27"             --notes "Подписанное обновление через интерфейс MusicFlow для официального пакета com.musicflow.preview. Исправлены обнаружение обновлений и проверка совместимости. VK Audio API остаётся экспериментальным источником, требует отдельно разрешённый VK доступ."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.27"             --jq '.assets[].name' | grep -Fx MusicFlow_0.7.27.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.27-signed-compatible-apk
          path: out/MusicFlow_0.7.27.apk
          retention-days: 30
          if-no-files-found: error
