name: Publish MusicFlow 0.7.34 verified locally signed update
on:
  push:
    branches: ["feature/musicflow-v0.7.34-radio-label"]
    paths: [".github/release-assets/v0734/unsigned-to-signed.patch.zst.b64"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: musicflow-v0734-offline-verified
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release manifests and signed delta
        uses: actions/checkout@v4
      - name: Prepare zstd and Android build tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          yes | sdkmanager "build-tools;36.0.0" >/dev/null || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Retrieve exactly validated unsigned APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 44914372372 -R "$GITHUB_REPOSITORY" \
            -n MusicFlow-0.7.34-aligned-unsigned --dir "$RUNNER_TEMP/unsigned"
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.34-aligned-unsigned.apk"
          echo "c4abe4c09bbd8524b5529e088bcf45f9b755943dfde6a4761cec28df91e13b0f  $UNSIGNED" | sha256sum -c -
      - name: Reconstruct signed APK without uploading signing credentials
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          base64 -d .github/release-assets/v0734/unsigned-to-signed.patch.zst.b64 > "$PATCH"
          echo "973ebbcef0adc0155e1547511e7dc7988530fa724fcf83a796154e9707784a23  $PATCH" | sha256sum -c -
          zstd -q -d \
            --patch-from="$RUNNER_TEMP/unsigned/MusicFlow_0.7.34-aligned-unsigned.apk" \
            "$PATCH" -o out/MusicFlow_0.7.34.apk
          echo "d9f65681f509cd9b436ef53b7d11a9264950c8721bbcd0c3d8ae83c57ecf00e5  out/MusicFlow_0.7.34.apk" | sha256sum -c -
      - name: Validate signed package, version, archive and stable certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.34.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -c -p 4 "$APK"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.musicflow.preview' versionCode='734' versionName='0.7.34'"
          FINGERPRINT=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$FINGERPRINT" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410"
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish GitHub release for in-app updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.34 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v0.7.34 already exists; refusing to overwrite."
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          MusicFlow 0.7.34 — официальное обновление, подписанное исходным сертификатом MusicFlow.

          - Вкладка «Русское радио» переименована в «Радио».
          - Улучшения из версий 0.7.31–0.7.33: таймер сна, коррекция времени текстов песен, история и статистика прослушивания.
          - Улучшено восстановление очереди, мини-плеер и фоновое воспроизведение при погашенном экране.
          - Версия 0.7.34 (versionCode 734), package com.musicflow.preview.

          Обновите из приложения: «О приложении» → «Проверить обновления» → «Скачать и установить».
          Не удаляйте установленную версию. Установку подтвердите системным установщиком Android.

          Сертификат подписи, пакет и SHA-256 проверены. Приватный ключ в GitHub не загружался.
          Тестирование непосредственно на Samsung S24 следует провести после установки.
          NOTES
          gh release create v0.7.34 out/MusicFlow_0.7.34.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MusicFlow 0.7.34 · Радио и улучшения плеера" \
            --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.34" \
            --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.34.apk'
      - name: Save verified signed APK to CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.34-official-signed
          path: |
            out/MusicFlow_0.7.34.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
