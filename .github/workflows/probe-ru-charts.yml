name: Probe public charts markup
on:
  push:
    branches: ["feature/musicflow-v0.7.36-home-charts-ru"]
    paths: [".github/workflows/probe-ru-charts.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect Russia charts HTML
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request
          for path in ['7d/','2026-11/','2026/']:
            url='https://blog.upsound.ai/charts/'+path
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'MusicFlowBot/0.7.36'})
              with urllib.request.urlopen(req,timeout=12) as response: s=response.read(1200000).decode('utf-8','replace')
              print('URL',url,'chars',len(s),'statuses')
              for needle in ['ДИНАСТИЯ','Земляк','chart-row','<table','<tbody','<ol','/charts/track/','Сумма слушателей','track-title','chart-track']:
                at=s.find(needle)
                print('NEEDLE',needle,at,'FRAG',re.sub(r'\s+',' ',s[max(0,at-250):at+350])[:540] if at>=0 else '')
              for m in list(re.finditer(r'<(?:article|li|tr)\b',s,re.I))[:8]:
                print('ELEMENT',re.sub(r'\s+',' ',s[m.start():m.start()+450])[:440])
            except Exception as e: print('FAIL',url,type(e).__name__,str(e)[:200])
          PY
