name: Build MusicFlow 0.7.39 signed candidate (no publication)
on:
  push:
    branches: ["feature/musicflow-v0.7.39-radio-catalog-recovery"]
    paths: [".github/workflows/musicflow-v0739-signed-candidate.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform and signing tools
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify fix and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_v0730.py
          python3 scripts/verify_v0739_radio.py
          gradle --no-daemon :app:testDebugUnitTest
      - name: Restore ORIGINAL MusicFlow release certificate from GitHub secrets
        shell: bash
        env:
          BASE64_KEYSTORE: ${{ secrets.MUSICFLOW_SIGNING_KEYSTORE_BASE64 }}
          BACKUP_PASSPHRASE: ${{ secrets.MUSICFLOW_SIGNING_BACKUP_PASSPHRASE }}
          STORE_PASSWORD: ${{ secrets.MUSICFLOW_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSICFLOW_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSICFLOW_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Missing GitHub Actions original release signing password/alias secrets"
            exit 1
          fi
          if [[ -n "$BASE64_KEYSTORE" ]]; then
            printf '%s' "$BASE64_KEYSTORE" | base64 -d > "$RUNNER_TEMP/musicflow-release.jks"
          elif [[ -n "$BACKUP_PASSPHRASE" ]]; then
            base64 -d .github/signing/MusicFlow_signing_release.jks.enc.b64 > "$RUNNER_TEMP/musicflow-release.jks.enc"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 350000 \
              -in "$RUNNER_TEMP/musicflow-release.jks.enc" \
              -out "$RUNNER_TEMP/musicflow-release.jks" \
              -pass env:BACKUP_PASSPHRASE
          else
            echo "::error::Missing original signing keystore secret or backup recovery secret"
            exit 1
          fi
          test "$KEY_ALIAS" = "musicflow"
          ACTUAL=$(keytool -list -v -keystore "$RUNNER_TEMP/musicflow-release.jks" \
            -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" | \
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | \
            tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" || {
            echo "::error::Keystore certificate differs from MusicFlow 0.7.38"
            exit 1
          }
          echo "MUSICFLOW_SIGNING_KEYSTORE=$RUNNER_TEMP/musicflow-release.jks" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build verified signed 0.7.39 candidate
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify package, version, signature, integrity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.musicflow.preview' versionCode='739' versionName='0.7.39'"
          ACTUAL=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$ACTUAL" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410"
          cp "$APK" out/MusicFlow_0.7.39.apk
          sha256sum out/MusicFlow_0.7.39.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.39-original-key-signed-candidate
          path: out/
          if-no-files-found: error
          retention-days: 30
