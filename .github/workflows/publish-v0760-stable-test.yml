name: Publish MusicFlow 0.7.60 TEST radio sketches, quality and controls
on:
  push:
    branches: ["feature/musicflow-cinema-quality-radio-controls-v0761"]
    paths:
      - ".github/workflows/publish-v0760-stable-test.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: musicflow-stable-test-v0760-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact JUnit preflight, source and fresh TEST tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/release-assets/v0760-test/checksums.env
          test "$SOURCE_SHA" = "5339b802d0c84e5d10a3913af3f456fae3ab3f9a"
          test "$SOURCE_RUN" = "46020472885"
          test "$SOURCE_ARTIFACT" = "MusicFlow-0.7.60-TEST-cinema-quality-radio-preflight"
          test "$TEST_CERT_SHA" = "5b021afbd43d8c4fc1de501bd5e000c8d0286da573a700121ace77339f199835"
          test "$TEST_CERT_SHA" != "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410"
          RUN_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.conclusion')
          RUN_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')
          test "$RUN_STATUS" = "success" || { echo "::error::TEST preflight did not pass"; exit 1; }
          test "$RUN_HEAD" = "$SOURCE_SHA" || { echo "::error::Wrong source commit"; exit 1; }
          git cat-file -e "$SOURCE_SHA^{commit}"
          git diff --quiet "$SOURCE_SHA" HEAD -- app/ settings.gradle.kts build.gradle.kts || {
            echo "::error::App sources changed since TEST preflight"; exit 1;
          }
          # Never release this build before Android instrumentation has actually passed.
          test "$EMULATOR_RUN" = "46020515711"
          echo "Waiting for the independent Android 14 emulator run $EMULATOR_RUN"
          EMU_STATUS=""
          for attempt in $(seq 1 120); do
            EMU_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EMULATOR_RUN" --jq '.status')
            if test "$EMU_STATUS" = "completed"; then break; fi
            sleep 15
          done
          test "$EMU_STATUS" = "completed" || { echo "::error::Emulator run did not complete"; exit 1; }
          EMU_RESULT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EMULATOR_RUN" --jq '.conclusion')
          EMU_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EMULATOR_RUN" --jq '.head_sha')
          test "$EMU_RESULT" = "success" || { echo "::error::Emulator run failed: $EMU_RESULT"; exit 1; }
          git cat-file -e "$EMU_HEAD^{commit}"
          git diff --quiet "$SOURCE_SHA" "$EMU_HEAD" -- app/ settings.gradle.kts build.gradle.kts || {
            echo "::error::Emulator tested different application source"; exit 1;
          }
          echo "PASS: real Android emulator instrumentation verified"
          if gh release view v0.7.60-test -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::TEST release already exists: refusing overwrite"; exit 1;
          fi
          echo "PASS: 0.7.60 TEST preflight success and unchanged app sources"
      - name: Obtain the exact tested preflight APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/release-assets/v0760-test/checksums.env
          mkdir -p work/preflight work/signing out
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n "$SOURCE_ARTIFACT" -D work/preflight
          test -s "work/preflight/$SOURCE_FILE"
          echo "$UNSIGNED_SHA  work/preflight/$SOURCE_FILE" | sha256sum -c -
      - name: Reproduce privately signed APK from non-secret byte patch
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-assets/v0760-test/checksums.env
          base64 -d .github/release-assets/v0760-test/signed-delta.doublezstd.b64 > work/signing/signed-delta.doublezstd
          echo "$OUTER_SHA  work/signing/signed-delta.doublezstd" | sha256sum -c -
          zstd -q -d work/signing/signed-delta.doublezstd -o work/signing/signed-delta.zst
          echo "$PATCH_SHA  work/signing/signed-delta.zst" | sha256sum -c -
          zstd -q -d --patch-from="work/preflight/$SOURCE_FILE" work/signing/signed-delta.zst -o out/MusicFlow-TEST_0.7.60.apk
          echo "$SIGNED_SHA  out/MusicFlow-TEST_0.7.60.apk" | sha256sum -c -
          (cd out && sha256sum MusicFlow-TEST_0.7.60.apk > SHA256SUMS.txt)
          echo "PASS: signed byte-for-byte reconstructed APK"
      - name: Validate Android signing, TEST package and version
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-assets/v0760-test/checksums.env
          yes | sdkmanager "build-tools;36.0.0" || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          APK=out/MusicFlow-TEST_0.7.60.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" > work/signing/verified.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" work/signing/verified.txt
          grep -F "Verified using v3 scheme (APK Signature Scheme v3): true" work/signing/verified.txt
          CERT=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' work/signing/verified.txt | head -n 1)
          test "$CERT" = "$TEST_CERT_SHA" || { echo "::error::Wrong TEST certificate"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" \
            | grep -F "name='com.musicflow.preview.dev' versionCode='760' versionName='0.7.60-dev'"
          echo "PASS: stable TEST cert / v2+v3 / package versionCode 760"
      - name: Publish distinct TEST prerelease for built-in updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/release-assets/v0760-test/checksums.env
          # A pre-existing, verified commit tag avoids release creation asking
          # for an implicit git ref. Never force-update release tags.
          if ! git show-ref --verify --quiet refs/tags/v0.7.60-test; then
            git tag v0.7.60-test "$SOURCE_SHA"
            git push origin refs/tags/v0.7.60-test
          fi
          gh release create v0.7.60-test out/MusicFlow-TEST_0.7.60.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --verify-tag --target "$SOURCE_SHA" --prerelease \
            --title "MusicFlow 0.7.60 TEST · качество HLS, MP4 и загрузки" \
            --notes "MusicFlow TEST 0.7.60-dev (760), com.musicflow.preview.dev. Девять встроенных оптимизированных WebP обложек-заглушек для радиостанций без действующего логотипа; проверенный логотип имеет приоритет. Кнопки предыдущая/следующая радиостанция и переключатель по списку/вразнобой, режим сохраняется при переключении станций. Выбор исходного качества музыки, HLS/DASH разрешения и качества видео при скачивании в кино-плеере. Для DASH выбирается аудиодорожка; прямой MP4 скачивается в оригинальном качестве без искусственного повышения. Ограничения доступа, авторское право, DRM не обходятся. Исходники и Android-инструментальные проверки прошли CI. APK подписан стабильным сертификатом TEST 0.7.58, совместим для обновления без удаления. Применены ub-mode, контроль SHA256 и Android v2/v3."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.60-test" --jq '.prerelease' | grep -Fx true
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.60-test" --jq '.assets[] | select(.name=="MusicFlow-TEST_0.7.60.apk") | .digest' |
            grep -Fx "sha256:$SIGNED_SHA"
          echo "PASS: isolated stable signed TEST 0.7.60 published and digest matched"
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.60-TEST-stable-signed
          path: out/
          if-no-files-found: error
          retention-days: 30
