name: Build MusicFlow Cinema Resolver TEST v6
on:
  push:
    branches: ["feature/musicflow-cinema-public-stream-resolver-v6"]
    paths: [".github/workflows/cinema-public-resolver-v6.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify isolated package and public video extraction architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          base=Path("app/src/main/java/com/musicflow/app")
          parser=(base/"CinemaPublicStreamResolver.kt").read_text()
          sources=(base/"CinemaNativeSources.kt").read_text()
          screen=(base/"CinemaLabScreen.kt").read_text()
          player=(base/"CinemaNativeInlinePlayer.kt").read_text()
          gradle=Path("app/build.gradle.kts").read_text()
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert 'applicationIdSuffix = ".cinematest6"' in gradle
          assert 'MusicFlow Кино Resolver TEST' in manifest
          assert 'https://ff.sanfilm2.link/' in sources
          assert 'CinemaPublicStreamResolver.resolve' in sources
          assert 'CinemaPublicStreamResolver.scan' in sources
          assert 'script[type=application/ld+json]' in parser
          assert 'JSONTokener' in parser and 'iframe' in parser
          assert 'CinemaNativeInlinePlayer(' in screen
          assert 'playbackDiagnostic' in screen
          assert 'DefaultHttpDataSource.Factory()' in player
          assert 'Referer' in player
          assert 'CinemaPluginsDialog' not in screen
          assert 'CinemaLampaWebScreen' not in screen
          print("PASS: isolated Cinema v6 / public video resolver / own Media3 player")
          PY
      - name: Unit tests and APK compile
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Non-blocking live accessibility probe (metadata only)
        shell: bash
        run: |
          set +e
          URL="https://ff.sanfilm2.link/69359-zavodchica-2026.html"
          CODE=$(curl -sS -L --max-redirs 3 --connect-timeout 6 --max-time 15 \
            -A "Mozilla/5.0 (Android) MusicFlowCinema/6" \
            -o /tmp/sanfilm-page.html -w "%{http_code}" "$URL")
          STATUS=$?
          echo "Sanfilm page probe: curl_exit=$STATUS http=$CODE"
          if [ "$STATUS" = "0" ] && [ "$CODE" = "200" ]; then
            python3 - <<'PY'
          from pathlib import Path
          text=Path("/tmp/sanfilm-page.html").read_text(errors="replace")
          print("HTML available; bytes:",len(text.encode()))
          print("Media suffix occurrences:",sum(text.lower().count(x) for x in (".mp4",".m3u8",".mpd")))
          print("Iframe marker occurrences:",text.lower().count("<iframe"))
          PY
          else
            echo "LIVE SITE NOT VERIFIED: access blocked or host unresolved from GitHub Actions."
          fi
          exit 0
      - name: Verify test APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview.cinematest6'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/MusicFlow-Cinema-Resolver-TEST-v6.apk
          sha256sum dist/MusicFlow-Cinema-Resolver-TEST-v6.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-Cinema-Resolver-TEST-v6-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error
