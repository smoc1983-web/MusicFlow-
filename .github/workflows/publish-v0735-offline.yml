name: Publish MusicFlow 0.7.35 verified locally signed update
on:
  push:
    branches: ["feature/musicflow-v0.7.35-top-tracks"]
    paths: [".github/release-assets/v0735/unsigned-to-signed.patch.zst.b64"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: musicflow-v0735-offline-verified
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout release manifests and signed delta
        uses: actions/checkout@v4
      - name: Prepare zstd and Android build tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          yes | sdkmanager "build-tools;36.0.0" >/dev/null || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Retrieve exactly validated unsigned APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 44935267559 -R "$GITHUB_REPOSITORY" \
            -n MusicFlow-0.7.35-aligned-unsigned --dir "$RUNNER_TEMP/unsigned"
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.35-aligned-unsigned.apk"
          echo "c3901a02870ec5082ae3a3e097e540395cdc9cbce02cc638db9690b9fbeb2db5  $UNSIGNED" | sha256sum -c -
      - name: Reconstruct signed APK without uploading signing credentials
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          base64 -d .github/release-assets/v0735/unsigned-to-signed.patch.zst.b64 > "$PATCH"
          echo "0ca7fe8bdc58f419fcf61a6718a07310ce47efcefa284e2c0d6349bd972ca4ff  $PATCH" | sha256sum -c -
          zstd -q -d \
            --patch-from="$RUNNER_TEMP/unsigned/MusicFlow_0.7.35-aligned-unsigned.apk" \
            "$PATCH" -o out/MusicFlow_0.7.35.apk
          echo "fd301300837b2fbfd951e0288833a9bf426ca7cbced205da5f26b27763eb2a3f  out/MusicFlow_0.7.35.apk" | sha256sum -c -
      - name: Validate signed package, version, archive and stable certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.35.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -c -p 4 "$APK"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.musicflow.preview' versionCode='735' versionName='0.7.35'"
          FINGERPRINT=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$FINGERPRINT" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410"
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish GitHub release for in-app updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.35 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v0.7.35 already exists; refusing to overwrite."
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          MusicFlow 0.7.35 — официальное обновление, подписанное исходным сертификатом MusicFlow.

          - Новая вкладка «ТОП песен»: мировая статистика ListenBrainz за неделю, месяц и год с числом зарегистрированных прослушиваний.
          - Нажатие на композицию запускает поиск точной записи по исполнителю и названию через подключённые источники MusicFlow.
          - Удалена нижняя кнопка «Другой источник» из полноэкранного музыкального плеера.
          - Исправлено положение результатов поиска: после поиска и обновления группировки список начинается с первого элемента.
          - Версия 0.7.35 (versionCode 735), package com.musicflow.preview. Данные и приложения сохраняются при обновлении поверх 0.7.34.

          Обновите из MusicFlow: «О приложении» → «Проверить обновления» → «Скачать и установить».
          ListenBrainz отражает подтверждённые прослушивания пользователей сервиса, не всех стриминговых платформ; каталог может быть временно недоступен. На Samsung S24 требуется реальная проверка.
          Подписанный APK, сертификат и SHA-256 проверены. Приватный ключ и пароли не загружались в GitHub.
          NOTES
          gh release create v0.7.35 out/MusicFlow_0.7.35.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MusicFlow 0.7.35 · ТОП песен и исправление поиска" \
            --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.35" \
            --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.35.apk'
      - name: Save verified signed APK to CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.35-official-signed
          path: |
            out/MusicFlow_0.7.35.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
