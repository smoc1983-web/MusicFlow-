name: Build MusicFlow APK
on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check RuVideoHub playlist (diagnostic)
        shell: bash
        run: |
          curl -L -sS --max-time 20 -o /tmp/ruvideo.m3u8 -w 'RuVideoHub playlist: HTTP %{http_code}\n' \
            'https://raw.githubusercontent.com/ByteBudda/RuVideoHub/main/playlist_iptv.m3u8' || true
          grep -c '^#EXTINF:' /tmp/ruvideo.m3u8 || true
      - name: Verify Mail.ru Music endpoints (read-only)
        run: python3 scripts/diagnose_mailru.py
      - name: Verify v0.7.5 home playback and TV sizing
        run: python3 scripts/verify_v075.py
      - name: Verify v0.7.6 fullscreen, local IPTV and album wiring
        run: python3 scripts/verify_v076.py
      - name: Verify v0.7.7 album grouping and fixed player controls
        run: python3 scripts/verify_v077.py
      - name: Probe alternative album metadata APIs
        run: python3 scripts/probe_album_metadata.py
      - name: Verify v0.7.8 album enrichment and Zaycev-first UI
        run: python3 scripts/verify_v078.py
      - name: Verify v0.7.9 Zaycev native playback and UI fixes
        run: python3 scripts/verify_v079.py
      - name: Verify v0.7.10 stream fallbacks and recovery guard
        run: python3 scripts/verify_v0710.py
      - name: Verify v0.7.11 Zaycev collection playback queue
        run: python3 scripts/verify_v0711.py
      - name: Verify v0.7.12 UI, cover and TV mini-player integration
        run: python3 scripts/verify_v0712.py
      - name: Verify v0.7.13 TV floating player, themes and app icon
        run: python3 scripts/verify_v0713.py
      - name: Verify v0.7.14 TV handoff and playback status
        run: python3 scripts/verify_v0714.py
      - name: Verify v0.7.15 artwork, AudioBook themes, compact navigation and TV
        run: python3 scripts/verify_v0715.py
      - name: Verify v0.7.16 high-resolution artwork, themed menus and playback
        run: python3 scripts/verify_v0716.py
      - name: Verify v0.7.17 graphite launcher and themed mini-player
        run: python3 scripts/verify_v0717.py
      - name: Verify v0.7.18 in-app updates, donation and Telegram navigation
        run: python3 scripts/verify_v0718.py
      - name: Verify v0.7.19 banking support, in-app APK installer and icon
        run: python3 scripts/verify_v0719.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
