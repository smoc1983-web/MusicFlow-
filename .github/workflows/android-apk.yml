name: Build MusicFlow APK
on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Diagnose Audius API (no credentials)
        shell: bash
        run: |
          for base in "https://api.audius.co/v1" "https://discoveryprovider.audius.co/v1"; do
            for params in "app_name=MusicFlowAndroid&limit=40" "limit=2"; do
              echo "Endpoint: $base/tracks/trending?$params"
              code=$(curl -L -sS --max-time 20 -o /tmp/audius-response.json -w "%{http_code}" "$base/tracks/trending?$params") || code="network-error"
              echo "HTTP: $code"
              head -c 500 /tmp/audius-response.json || true
              echo ""
            done
          done
      - name: Check RuVideoHub playlist (diagnostic)
        shell: bash
        run: |
          curl -L -sS --max-time 20 -o /tmp/ruvideo.m3u8 -w 'RuVideoHub playlist: HTTP %{http_code}\n' \
            'https://raw.githubusercontent.com/ByteBudda/RuVideoHub/main/playlist_iptv.m3u8' || true
          grep -c '^#EXTINF:' /tmp/ruvideo.m3u8 || true
      - name: Verify Mail.ru Music endpoints (read-only)
        run: python3 scripts/diagnose_mailru.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
