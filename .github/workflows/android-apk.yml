name: Build MusicFlow APK
on:
  push:
    branches: [main, "feature/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check RuVideoHub playlist (diagnostic)
        shell: bash
        run: |
          curl -L -sS --max-time 20 -o /tmp/ruvideo.m3u8 -w 'RuVideoHub playlist: HTTP %{http_code}\n' \
            'https://raw.githubusercontent.com/ByteBudda/RuVideoHub/main/playlist_iptv.m3u8' || true
          grep -c '^#EXTINF:' /tmp/ruvideo.m3u8 || true
      - name: Verify Mail.ru Music endpoints (read-only)
        run: python3 scripts/diagnose_mailru.py
      - name: Probe Zaycev public endpoints and artwork
        run: python3 scripts/diagnose_zaycev.py
      - name: Verify v0.7.5 home playback and TV sizing
        run: python3 scripts/verify_v075.py
      - name: Verify v0.7.6 fullscreen, local IPTV and album wiring
        run: python3 scripts/verify_v076.py
      - name: Verify v0.7.7 album grouping and fixed player controls
        run: python3 scripts/verify_v077.py
      - name: Probe alternative album metadata APIs
        run: python3 scripts/probe_album_metadata.py
      - name: Verify v0.7.8 album enrichment and Zaycev-first UI
        run: python3 scripts/verify_v078.py
      - name: Probe native Zaycev search and audio endpoints
        run: python3 scripts/probe_zaycev_playback.py
      - name: Inspect Zaycev Next.js public playback APIs
        run: python3 scripts/diagnose_zaycev_modern.py
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
