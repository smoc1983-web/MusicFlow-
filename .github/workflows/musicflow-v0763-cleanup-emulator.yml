name: MusicFlow TEST 0.7.63 required Android UI/DASH + live sources diagnostic
run-name: MusicFlow TEST 0.7.63 · радио, DASH и источники · ${{ github.run_number }}
on:
  push:
    branches: ["feature/musicflow-cleanup-cache-updates-v0763"]
    paths:
      - ".github/workflows/musicflow-v0763-cleanup-emulator.yml"
      - ".github/scripts/musicflow-v0763-cleanup-emulator.sh"
      - "app/src/androidTest/**"
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrumented-emulator:
    name: Android ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [offline, radio, live]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Require hardware acceleration (KVM)
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Compile TEST app and real Android instrumentation APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Android 14 accelerated emulator - required radio/DASH and real provider diagnostic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # No GMS dependency in app/build.gradle.kts; remove cold-boot Google service load.
          target: default
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-linux-hw-accel: false
          ram-size: 3072M
          heap-size: 384M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -feature -Vulkan -camera-back none -camera-front none
          emulator-boot-timeout: 600
          script: bash .github/scripts/musicflow-v0763-cleanup-emulator.sh ${{ matrix.suite }}
      - name: Collect host emulator exit diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p emulator-evidence
          free -m > emulator-evidence/host-memory.txt
          df -h > emulator-evidence/host-disk.txt
          sudo dmesg -T | tail -n 500 > emulator-evidence/host-kernel.txt || true
          ps -eo pid,ppid,stat,rss,comm --sort=-rss | head -n 50 > emulator-evidence/host-processes.txt || true
          cat /sys/fs/cgroup/memory.events > emulator-evidence/host-memory-events.txt 2>/dev/null || true
          "$ANDROID_HOME/emulator/emulator" -version > emulator-evidence/emulator-version.txt 2>&1 || true
          find /tmp/android-* -maxdepth 3 -type f -name '*.log' -size -5M -exec cp -- '{}' emulator-evidence/ \; 2>/dev/null || true
      - name: Upload source statuses and radio screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.63-Android-${{ matrix.suite }}-evidence
          path: emulator-evidence/
          retention-days: 30
          if-no-files-found: warn
