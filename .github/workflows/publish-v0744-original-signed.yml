name: Publish official signed MusicFlow 0.7.44
on:
  push:
    branches: ["feature/musicflow-v0744-radio-update-bluetooth-eq"]
    paths:
      - ".github/release-assets/v0744/signed-delta.doublezstd.b64"
permissions:
  contents: write
  actions: read
concurrency:
  group: official-musicflow-v0744
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare zip verification tools and zstd
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y zstd
          fi
          yes | sdkmanager "build-tools;36.0.0" >/dev/null ||
            test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Fetch tested and aligned unsigned APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/release-assets/v0744/checksums.env
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 45035544758 -R "$GITHUB_REPOSITORY"             -n MusicFlow-0.7.44-aligned-unsigned-for-original-signature             --dir "$RUNNER_TEMP/unsigned"
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.44-aligned-unsigned.apk"
          echo "$UNSIGNED_SHA  $UNSIGNED" | sha256sum -c -
          ACTUAL_SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45035544758" --jq '.head_sha')
          test "$ACTUAL_SOURCE" = "$SOURCE_SHA" || {
            echo "::error::The unsigned APK source revision changed."
            exit 1
          }
      - name: Reconstruct APK signed with private original MusicFlow key
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-assets/v0744/checksums.env
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.44-aligned-unsigned.apk"
          OUTER="$RUNNER_TEMP/signed-delta.doublezstd"
          PATCH="$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          base64 -d .github/release-assets/v0744/signed-delta.doublezstd.b64 > "$OUTER"
          echo "$OUTER_SHA  $OUTER" | sha256sum -c -
          zstd -q -d "$OUTER" -o "$PATCH"
          echo "$PATCH_SHA  $PATCH" | sha256sum -c -
          zstd -q -d --patch-from="$UNSIGNED" "$PATCH" -o out/MusicFlow_0.7.44.apk
          echo "$SIGNED_SHA  out/MusicFlow_0.7.44.apk" | sha256sum -c -
      - name: Verify release identity, signer and install compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.44.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          "$TOOLS/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='744' versionName='0.7.44'"
          FINGERPRINT=$("$TOOLS/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$FINGERPRINT" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" || {
            echo "::error::APK is not signed with original MusicFlow certificate."
            exit 1
          }
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish v0.7.44 into in-app update channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.44 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v0.7.44 already exists; cannot overwrite signed APK."
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          MusicFlow 0.7.44 — обновлятор, радио и Bluetooth-эквалайзер.

          - Исправлено повторное предложение обновления уже установленной версии: проверка versionCode и очистка завершённой загрузки.
          - После нажатия «Скачать обновление» диалог закрывается, а скачивание продолжается в системной фоновой службе Android DownloadManager.
          - Радио-плеер: оставлены только воспроизведение и добавление станции в избранное; удалены неработающие кнопки перемотки, переключения, повтор и случайный порядок.
          - Удалена надпись «Русское радио · прямой эфир»; радио-избранное синхронизировано с разделом радиостанций.
          - Исправлена маршрутизация Bluetooth-звука с эквалайзером: отключён аппаратный audio offload, добавлены плавное применение ползунков и переподключение к новой аудиосессии при смене выхода.
          - Сохранены IPTV-исправления 0.7.43, каталог кино, серии и озвучка. Экспериментальная Pro-ветка не изменена.

          Обновление поверх установленной MusicFlow: package com.musicflow.preview, versionCode 744, versionName 0.7.44, прежний сертификат.
          Откройте MusicFlow → О приложении → Проверить обновления; удалять текущую версию не требуется.
          Реальная работа Bluetooth-эквалайзера зависит от аудиооборудования и требует пользовательской проверки.
          NOTES
          gh release create v0.7.44 out/MusicFlow_0.7.44.apk out/SHA256SUMS.txt             -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest             --title "MusicFlow 0.7.44 · Радио, обновления и Bluetooth"             --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.44"             --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.44.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.44-official-signed
          path: |
            out/MusicFlow_0.7.44.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
