name: Publish MusicFlow 0.7.51 original-key in-app update cache repair
on:
  push:
    branches: [main]
    paths:
      - ".github/release-assets/v0751/signed-delta.doublezstd.b64"
      - ".github/workflows/publish-v0751-original-signed.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: official-musicflow-v0751
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare APK signature verification
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update -qq && sudo apt-get install -y zstd; }
          yes | sdkmanager "build-tools;36.0.0" >/dev/null ||
            test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Download tested original unsigned APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/release-assets/v0751/checksums.env
          test "$SOURCE_SHA" = "c54b7b4ed2e8227390d7715da5915814ad2028a8"
          # Signed bytes refer to one exact, previously tested app source. Documentation edits are allowed.
          git diff --quiet "$SOURCE_SHA" HEAD -- app/ || {
            echo "::error::App sources changed since signed preflight; rebuild and sign again."
            exit 1
          }
          PREFLIGHT_STATUS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45679777474" --jq '.conclusion')
          test "$PREFLIGHT_STATUS" = "success" || {
            echo "::error::Official 0.7.51 preflight did not pass."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 45679777474 -R "$GITHUB_REPOSITORY" \
            -n MusicFlow-0.7.51-official-unsigned-and-tools \
            --dir "$RUNNER_TEMP/unsigned"
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.51-aligned-unsigned.apk"
          echo "$UNSIGNED_SHA  $UNSIGNED" | sha256sum -c -
          SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45679777474" \
            --jq '.head_sha')
          test "$SOURCE" = "$SOURCE_SHA" || {
            echo "::error::Signed APK source mismatch."
            exit 1
          }
      - name: Reconstruct privately signed release from nonsecret signed-byte delta
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-assets/v0751/checksums.env
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.51-aligned-unsigned.apk"
          OUTER="$RUNNER_TEMP/signed-delta.doublezstd"
          PATCH="$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          base64 -d .github/release-assets/v0751/signed-delta.doublezstd.b64 > "$OUTER"
          echo "$OUTER_SHA  $OUTER" | sha256sum -c -
          zstd -q -d "$OUTER" -o "$PATCH"
          echo "$PATCH_SHA  $PATCH" | sha256sum -c -
          zstd -q -d --patch-from="$UNSIGNED" "$PATCH" \
            -o out/MusicFlow_0.7.51.apk
          echo "$SIGNED_SHA  out/MusicFlow_0.7.51.apk" | sha256sum -c -
      - name: Verify unchanged app identity and release certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.51.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          "$TOOLS/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='751' versionName='0.7.51'"
          CERT=$("$TOOLS/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$CERT" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" ||
            { echo "::error::Wrong signing certificate"; exit 1; }
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish official 0.7.51 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.51 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v0.7.51 already exists; refusal to overwrite"
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          MusicFlow 0.7.51 — официальный выпуск для обновления поверх 0.7.49.

          - Правильная подпись и исходный пакет com.musicflow.preview.
          - Номер версии повышен до 0.7.51 (751), чтобы заменить ранее скачанный тестовый APK 0.7.50 (750).
          - Обновлятор игнорирует тестовые GitHub Releases и удаляет сохранённые тестовые загрузки.
          - Сохранены улучшенные обложки радио, Compact Glass, эквалайзер, кино и IPTV.
          - Android v2/v3 подписи исходным сертификатом MusicFlow, контроль сертификата и SHA256 в GitHub Actions.

          NOTES
          source .github/release-assets/v0751/checksums.env
          gh release create v0.7.51 out/MusicFlow_0.7.51.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --latest \
            --title "MusicFlow 0.7.51 · исправление обновления и обложек радио" \
            --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.51" \
            --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.51.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.51-official-signed
          path: |
            out/MusicFlow_0.7.51.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
