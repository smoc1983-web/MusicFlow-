name: MusicFlow TEST 0.7.62 required Android UI/DASH + live sources diagnostic
run-name: MusicFlow TEST 0.7.62 · радио, DASH и источники · ${{ github.run_number }}
on:
  push:
    branches: ["feature/musicflow-background-export-hls-v0762"]
    paths:
      - ".github/workflows/musicflow-v0762-background-emulator.yml"
      - ".github/scripts/musicflow-v0762-background-emulator.sh"
      - "app/src/androidTest/**"
      - "app/src/main/**"
      - "app/build.gradle.kts"
      - "settings.gradle.kts"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrumented-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Require hardware acceleration (KVM)
        shell: bash
        run: |
          set -euo pipefail
          test -c /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm
      - name: Compile TEST app and real Android instrumentation APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Android 14 accelerated emulator - required radio/DASH and real provider diagnostic
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # No GMS dependency in app/build.gradle.kts; remove cold-boot Google service load.
          target: default
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-linux-hw-accel: false
          ram-size: 3072M
          heap-size: 384M
          disk-size: 6G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -feature -Vulkan
          emulator-boot-timeout: 600
          script: bash .github/scripts/musicflow-v0762-background-emulator.sh
      - name: Upload source statuses and radio screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.62-Android-UI-DASH-and-live-source-evidence
          path: emulator-evidence/
          retention-days: 30
          if-no-files-found: warn
