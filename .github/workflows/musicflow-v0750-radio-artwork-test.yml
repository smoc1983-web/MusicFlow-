name: MusicFlow 0.7.50 radio artwork TEST APK
on:
  push:
    branches: ["feature/musicflow-v0750-radio-cover-recovery"]
    paths:
      - "app/**"
      - ".github/workflows/musicflow-v0750-radio-artwork-test.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" ||
            test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run radio artwork regressions and all Kotlin/JUnit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Inspect tests, package, signature and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          suites = list(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          names = "\n".join(s.name for s in suites)
          for name in ("RadioArtworkCatalogTest", "RadioStationArtworkFallbackTest",
                       "RussianRadioFallbackTest", "RadioCompactGlassPolicyTest"):
              assert name in names, f"Missing: {name}"
          print(f"Verified {len(suites)} JUnit suites")
          PY
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview.radioarttest50' versionCode='750' versionName='0.7.50-test'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p out
          cp "$APK" out/MusicFlow-RadioArtwork-TEST-0.7.50.apk
          cd out
          sha256sum MusicFlow-RadioArtwork-TEST-0.7.50.apk > SHA256SUMS.txt
      - name: Archive test APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-RadioArtwork-TEST-0.7.50
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable test prerelease
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.7.50-radio-artwork-test
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/MusicFlow-RadioArtwork-TEST-0.7.50.apk out/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" out/MusicFlow-RadioArtwork-TEST-0.7.50.apk out/SHA256SUMS.txt \
              --title "MusicFlow 0.7.50 TEST — обложки радио" \
              --notes "Отдельное тестовое приложение для проверки реальных логотипов радиостанций. Не заменяет официальную MusicFlow 0.7.49. Проверены PNG/JPEG/WebP/GIF и альтернативные ссылки на обложки; если логотип не найден, отображается персональная цветная карточка." \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
