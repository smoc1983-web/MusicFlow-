name: MusicFlow Android background playback soak

on:
  push:
    branches: ["feature/musicflow-v0.7.33-resume-miniplayer-soak"]
    paths:
      - ".github/workflows/android-background-soak.yml"
      - "app/src/androidTest/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  media-session-background-soak:
    name: 130-second screen-off Media3 soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Launch emulator and test Media3 with display off
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - name: Upload test result XML and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.33-android-background-soak-results
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 14
