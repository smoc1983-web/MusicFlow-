name: Publish MusicFlow 0.7.30 verified official update
on:
  push:
    branches: ["feature/musicflow-v0.7.30-russian-radio-lyrics"]
    paths: [".github/workflows/publish-v0730-verified.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: musicflow-official-v0730
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out public signing delta and release metadata
        uses: actions/checkout@v4
      - name: Set up APK signature verifier
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          yes | sdkmanager "build-tools;36.0.0" >/dev/null || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Download exact release APK from successful trusted GitHub build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 44896404208 -R "$GITHUB_REPOSITORY" \
            -n MusicFlow-0.7.30-aligned-unsigned --dir "$RUNNER_TEMP/unsigned"
          echo "f5786898e27c387c06c0363796220e7042ae4837d69717ed466f3d01c9bbadfd  $RUNNER_TEMP/unsigned/MusicFlow_0.7.30-aligned-unsigned.apk" | sha256sum -c -

      - name: Reconstruct exact locally signed APK without exposing the signing key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/release-assets/v0730/unsigned-to-signed.patch.zst.b64 \
            > "$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          echo "412bca921aa2d4d5e73dbcd9c3971214494aaea19863b8f0073473bfba958598  $RUNNER_TEMP/unsigned-to-signed.patch.zst" | sha256sum -c -
          zstd -q -d \
            --patch-from="$RUNNER_TEMP/unsigned/MusicFlow_0.7.30-aligned-unsigned.apk" \
            "$RUNNER_TEMP/unsigned-to-signed.patch.zst" \
            -o out/MusicFlow_0.7.30.apk
          echo "081a271bfa4c85a8d8538f853e08437246b28aa4e100f3a0dbce0396def8a8c8  out/MusicFlow_0.7.30.apk" | sha256sum -c -

      - name: Verify package, version, zip alignment and permanent signer
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.30.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -c -p 4 "$APK"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -F "name='com.musicflow.preview' versionCode='730' versionName='0.7.30'"
          SHA=$("$SIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$SHA" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" || {
            echo "::error::APK signing certificate differs from 0.7.22-0.7.28 official releases"
            exit 1
          }
          sha256sum "$APK" > out/SHA256SUMS.txt

      - name: Publish signed APK to the in-app updater's GitHub Releases feed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.30 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v0.7.30 is already published. Refusing to overwrite a signed release."
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          Официальное обновление MusicFlow 0.7.30 (versionCode 730) для com.musicflow.preview, совместимое с подписью предыдущих релизов.

          Новое:
          - Русское радио: отдельная вкладка, поиск станций России, избранное, воспроизведение в Media3.
          - Тексты песен: синхронизация с LRCLIB, когда текст найден.
          - История прослушивания с очисткой, сохранение очереди и позиций при перезапуске.
          - Запоминание повтора/перемешивания и кнопка ручного выбора другого найденного источника.
          - Эквалайзер с пресетами и регулируемым усилением из рабочей ветки 0.7.29.
          - VK удалён; Audius и Jamendo не добавлялись.

          Обновите из MusicFlow: «О приложении» → «Проверить обновления» → «Скачать и установить». Не удаляйте старую версию. Установку подтвердите в Android.

          Передача паролей и приватного ключа в GitHub не производилась: выпуск проверен по SHA-256, идентификатору пакета и постоянному сертификату.
          Не все потоки радио или тексты песен доступны на каждом устройстве; нужен тест на телефоне. Google Play Защита проверяет приложение независимо.
          NOTES
          gh release create v0.7.30 out/MusicFlow_0.7.30.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target 13b3e5cf33b8a5d0e45d0e27af267cb425ef029c \
            --title "MusicFlow 0.7.30 · русское радио и тексты песен" \
            --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.30" \
            --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.30.apk'

      - name: Archive the published APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.30-verified-signed-release
          path: |
            out/MusicFlow_0.7.30.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
