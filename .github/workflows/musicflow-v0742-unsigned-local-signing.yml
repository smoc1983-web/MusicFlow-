name: Prepare unsigned MusicFlow 0.7.42 for original offline signing
on:
  push:
    branches: ["feature/musicflow-v0742-episode-audit-recovery"]
    paths: [".github/workflows/musicflow-v0742-unsigned-local-signing.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK build tools
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile release without signing keys
        shell: bash
        run: |
          set -euo pipefail
          test -z "${MUSICFLOW_SIGNING_KEYSTORE:-}"
          gradle --no-daemon :app:assembleRelease
          TEST=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$TEST"
          mkdir -p out/android-tools/lib
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -p -f 4 "$TEST" out/MusicFlow_0.7.42-aligned-unsigned.apk
          "$TOOLS/aapt" dump badging out/MusicFlow_0.7.42-aligned-unsigned.apk |
            grep -F "name='com.musicflow.preview' versionCode='742' versionName='0.7.42'"
          cp "$TOOLS/apksigner" out/android-tools/apksigner
          cp "$TOOLS/lib/apksigner.jar" out/android-tools/lib/apksigner.jar
          chmod +x out/android-tools/apksigner
          sha256sum out/MusicFlow_0.7.42-aligned-unsigned.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.42-aligned-unsigned-and-signing-tools
          path: out/
          retention-days: 30
          if-no-files-found: error
