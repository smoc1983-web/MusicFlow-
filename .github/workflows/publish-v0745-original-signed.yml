name: Publish official signed MusicFlow 0.7.45
on:
  push:
    branches: ["feature/musicflow-v0745-update-eq-radio-artwork"]
    paths:
      - ".github/release-assets/v0745/signed-delta.doublezstd.b64"
      - ".github/workflows/publish-v0745-original-signed.yml"
permissions:
  contents: write
  actions: read
concurrency:
  group: official-musicflow-v0745
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare zip verification tools and zstd
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y zstd
          fi
          yes | sdkmanager "build-tools;36.0.0" >/dev/null ||
            test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Fetch tested and aligned unsigned APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/release-assets/v0745/checksums.env
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 45038975675 -R "$GITHUB_REPOSITORY"             -n MusicFlow-0.7.45-unsigned-validation-only             --dir "$RUNNER_TEMP/unsigned"
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.45-unsigned.apk"
          echo "$UNSIGNED_SHA  $UNSIGNED" | sha256sum -c -
          ACTUAL_SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45038975675" --jq '.head_sha')
          test "$ACTUAL_SOURCE" = "$SOURCE_SHA" || {
            echo "::error::The unsigned APK source revision changed."
            exit 1
          }
      - name: Reconstruct APK signed with private original MusicFlow key
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-assets/v0745/checksums.env
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.45-unsigned.apk"
          OUTER="$RUNNER_TEMP/signed-delta.doublezstd"
          PATCH="$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          base64 -d .github/release-assets/v0745/signed-delta.doublezstd.b64 > "$OUTER"
          echo "$OUTER_SHA  $OUTER" | sha256sum -c -
          zstd -q -d "$OUTER" -o "$PATCH"
          echo "$PATCH_SHA  $PATCH" | sha256sum -c -
          zstd -q -d --patch-from="$UNSIGNED" "$PATCH" -o out/MusicFlow_0.7.45.apk
          echo "$SIGNED_SHA  out/MusicFlow_0.7.45.apk" | sha256sum -c -
      - name: Verify release identity, signer and install compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.45.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          "$TOOLS/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='745' versionName='0.7.45'"
          FINGERPRINT=$("$TOOLS/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$FINGERPRINT" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" || {
            echo "::error::APK is not signed with original MusicFlow certificate."
            exit 1
          }
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish v0.7.45 into in-app update channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.45 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v0.7.45 already exists; cannot overwrite signed APK."
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          MusicFlow 0.7.45 — Liquid Glass и исправления воспроизведения.

          - Пять новых тем оформления Liquid Glass: Obsidian Glass, Arctic Crystal, Pearl Vision, Emerald Flow и Solar Glass. По умолчанию — Obsidian Glass. Десять старых тем заменены, сохранённые настройки безопасно переводятся на новую.
          - Исправлено зависающее окно обновления: диалог закрывается сразу после нажатия, прежде чем начинается асинхронное скачивание; одна и та же установленная версия не должна предлагаться повторно.
          - Эквалайзер теперь обрабатывает PCM внутри Media3 без системного AudioEffect, прерывавшего воспроизведение при переключении Bluetooth; настройки обновляются без команд Pause/Seek.
          - Радио: добавлена отдельная кнопка закрытия мини- и полного плеера; открытые логотипы радиостанций подгружаются из каталога метаданных, но резервный список потоков не заменяется.
          - Сохранены исправления IPTV, кинораздел, проверка сезонов/серий и избранное. Pro-ветка не затронута.

          Регрессионные тесты: 29 Kotlin/JUnit тестовых наборов, сборка релизного APK прошла в GitHub Actions.
          Официальная подпись прежним ключом; пакет com.musicflow.preview, versionCode 745, версия 0.7.45.
          Устанавливается поверх MusicFlow 0.7.44, удалять приложение не требуется. Обновление доступно из меню «О приложении · обновления».
          Реальное Bluetooth-аудио и системное окно установки требуют проверки на устройстве.

          NOTES
          gh release create v0.7.45 out/MusicFlow_0.7.45.apk out/SHA256SUMS.txt             -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest             --title "MusicFlow 0.7.45 · Liquid Glass и исправления плеера"             --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.45"             --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.45.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.45-official-signed
          path: |
            out/MusicFlow_0.7.45.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
