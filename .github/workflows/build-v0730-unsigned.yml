name: Build MusicFlow 0.7.30 unsigned for official signing
on:
  push:
    branches: ["feature/musicflow-v0.7.30-russian-radio-lyrics"]
    paths: [".github/workflows/build-v0730-unsigned.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK build tools
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify Russian radio, lyrics and playback
        run: |
          python3 scripts/verify_v0729.py
          python3 scripts/verify_v0730.py
      - name: Build official release package without signing
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify release package and align
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='730' versionName='0.7.30'"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK" dist/MusicFlow_0.7.30-aligned-unsigned.apk
          sha256sum dist/MusicFlow_0.7.30-aligned-unsigned.apk > dist/UNSIGNED_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.30-aligned-unsigned
          path: dist/
          retention-days: 30
          if-no-files-found: error
