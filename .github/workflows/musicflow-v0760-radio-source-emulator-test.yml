name: MusicFlow 0.7.60 TEST radio, source playback and video download quality
on:
  push:
    branches: ["feature/musicflow-radio-quality-emulator-v0760"]
    paths:
      - "app/**"
      - ".github/workflows/musicflow-v0760-radio-source-emulator-test.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kotlin-and-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: "ub-mode: Kotlin JUnit and DEBUG/AndroidTest APK compilation"
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Validate unit regressions, TEST identity, player controls and APK signatures
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          root=Path('app/src/main/java/com/musicflow/app')
          main=(root/'MainActivity.kt').read_text()
          dialog=(root/'CompactGlassRadioDialog.kt').read_text()
          radio=(root/'RussianRadio.kt').read_text()
          artwork=(root/'RadioStationArtwork.kt').read_text()
          dash=(root/'DashVideoQuality.kt').read_text()
          offline=(root/'OfflineDownloads.kt').read_text()
          gradle=Path('app/build.gradle.kts').read_text()
          assert 'radioPlaylist = true' in main
          assert 'RadioQueuePolicy.playlist' in main
          assert 'MusicDownloadChoicePolicy.choices' in main
          assert 'dashQualities' in main and 'DashVideoQualityInspector.inspect' in main
          assert 'hlsQualities' in main and 'HlsQualityInspector.inspect' in main
          assert 'dashStreamKeys' in offline and 'setStreamKeys' in offline
          assert 'Следующая радиостанция' in dialog
          assert 'Предыдущая радиостанция' in dialog
          assert 'player.shuffleModeEnabled' in dialog
          assert 'RadioStationArtwork(' in radio and 'RadioStationArtwork(' in dialog
          assert 'error = { placeholder() }' in artwork
          assert 'DashManifestParser' in dash
          assert 'versionCode = 760' in gradle and 'versionName = "0.7.60"' in gradle
          for name,expected in [
              ('RadioQueuePolicyTest',3),
              ('MusicDownloadChoicePolicyTest',4),
              ('RadioStationArtworkFallbackTest',1),
              ('RadioArtworkCatalogTest',1),
              ('HlsQualityPolicyTest',4),
              ('WorldChartCoversTest',6)
          ]:
              hits=list(Path('app/build/test-results/testDebugUnitTest').glob('TEST-*'+name+'.xml'))
              assert hits, 'Missing '+name
              suite=ET.parse(hits[0]).getroot()
              assert int(suite.attrib.get('tests',0))>=expected, (name, suite.attrib)
              assert int(suite.attrib.get('failures',0))==0, (name,suite.attrib)
              assert int(suite.attrib.get('errors',0))==0, (name,suite.attrib)
          print('PASS: radio queue, fallback artwork, video quality, audio quality, HLS, charts')
          PY
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview.dev' versionCode='760' versionName='0.7.60-dev'"
          mkdir -p out
          cp "$APK" out/MusicFlow-0.7.60-TEST-preflight.apk
          (cd out && sha256sum MusicFlow-0.7.60-TEST-preflight.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.60-TEST-radio-video-quality-preflight
          path: out/
          retention-days: 30
          if-no-files-found: error

  live-android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build instrumented application and test APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Boot Android 14 emulator, probe real music providers and radio UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          disk-size: 6G
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            mkdir -p emulator-evidence
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            set +e
            adb shell am instrument -w -e class 'com.musicflow.app.MusicSourcesEmulatorTest,com.musicflow.app.DashVideoQualityTest' com.musicflow.preview.dev.test/androidx.test.runner.AndroidJUnitRunner 2>&1 | tee emulator-evidence/instrumentation.txt
            test_status=${PIPESTATUS[0]}
            set -e
            adb logcat -d -s MUSICFLOW_SOURCE_PROBE:I '*:S' > emulator-evidence/provider-diagnostics.log || true
            adb pull /sdcard/Android/data/com.musicflow.preview.dev/files/source-probe-v0760.txt emulator-evidence/ || true
            adb pull /sdcard/Android/data/com.musicflow.preview.dev/files/musicflow-radio-list-v0760.png emulator-evidence/ || true
            adb pull /sdcard/Android/data/com.musicflow.preview.dev/files/musicflow-radio-player-v0760.png emulator-evidence/ || true
            if test "${test_status}" -ne 0 || grep -E 'FAILURES!!!|INSTRUMENTATION_FAILED|FAILURE' emulator-evidence/instrumentation.txt; then
              echo '::error::Real Android emulator instrumentation did not pass'
              exit 1
            fi
            grep -Eq 'OK \([1-9][0-9]* tests?\)' emulator-evidence/instrumentation.txt
            echo 'PASS: Android emulator instrumentation and provider diagnostics retained'
      - name: Upload emulator screenshots and honest provider results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.60-emulator-source-radio-results
          path: emulator-evidence/
          retention-days: 30
          if-no-files-found: warn
