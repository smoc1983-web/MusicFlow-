name: Publish verified MusicFlow 0.7.28 in-app update
on:
  push:
    branches: ["feature/musicflow-v0.7.28-vk-login-playprotect"]
    paths: [".github/workflows/publish-v0728-verified.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: musicflow-publish-v0728-verified
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout audited source and non-sensitive signing delta
        uses: actions/checkout@v4

      - name: Prepare verification tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install APK verifier and zstd
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y zstd
          fi
          yes | sdkmanager "build-tools;36.0.0" >/dev/null || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Download exact CI-built unsigned 0.7.28 APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned" "$RUNNER_TEMP/verify" out
          gh run download 44892597597 -R "$GITHUB_REPOSITORY" \
            -n MusicFlow-0.7.28-unsigned -D "$RUNNER_TEMP/unsigned"
          test -s "$RUNNER_TEMP/unsigned/MusicFlow_0.7.28-aligned-unsigned.apk"
          echo "2856fae62194df725c5ba80ecf17402b06848bd374c3a8b60d802b78e55868ae  $RUNNER_TEMP/unsigned/MusicFlow_0.7.28-aligned-unsigned.apk" | sha256sum -c -

      - name: Rebuild byte-identical signed APK without exposing private key
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/release-assets/v0728/unsigned-to-signed.patch.zst.b64 > "$RUNNER_TEMP/verify/v0728.patch.zst"
          echo "5a3bf9136f13b4980f801b2027f5d15bdf3460bf3eca61e09ab97275f79fbaca  $RUNNER_TEMP/verify/v0728.patch.zst" | sha256sum -c -
          zstd -q -d \
            --patch-from="$RUNNER_TEMP/unsigned/MusicFlow_0.7.28-aligned-unsigned.apk" \
            "$RUNNER_TEMP/verify/v0728.patch.zst" -o out/MusicFlow_0.7.28.apk
          echo "b1a0c02b1911b38cd37fac4b04aa3e7e8ff01ce70a2693327386e4109035aee2  out/MusicFlow_0.7.28.apk" | sha256sum -c -

      - name: Verify official package, newer version and permanent signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.28.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='728' versionName='0.7.28'"
          SHA=$("$SIGNER" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$SHA" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" || {
            echo "::error::Signing certificate differs from the official MusicFlow 0.7.22-0.7.27 releases."
            exit 1
          }
          printf "%s  %s\n" "b1a0c02b1911b38cd37fac4b04aa3e7e8ff01ce70a2693327386e4109035aee2" "MusicFlow_0.7.28.apk" > out/SHA256SUMS.txt

      - name: Publish APK in the GitHub Release feed consumed by MusicFlow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.28 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v0.7.28 is already published. Refusing to overwrite a signed release."
            exit 1
          fi
          gh release create v0.7.28 out/MusicFlow_0.7.28.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MusicFlow 0.7.28 · VK аккаунт и обновления" \
            --notes "Обновление MusicFlow с тем же постоянным сертификатом и идентификатором com.musicflow.preview. Вход в личный VK и музыка — через официальный интерфейс vk.com в безопасной вкладке; нативный поток VK по-прежнему требует разрешённый Audio API. Play Защита управляется Google и не отключается приложением. Обновление проверяется и устанавливается из интерфейса MusicFlow с подтверждением Android."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.28" --jq '.assets[].name' |
            grep -Fx "MusicFlow_0.7.28.apk"

      - name: Retain verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.28-verified-official-apk
          path: |
            out/MusicFlow_0.7.28.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
