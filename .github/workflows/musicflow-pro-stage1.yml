name: Verify MusicFlow Pro stage-1 integration
on:
  push:
    branches: ["feature/musicflow-pro-integration-stage1"]
    paths:
      - "app/src/main/java/com/musicflow/app/MusicFlowProTrial.kt"
      - "app/src/main/java/com/musicflow/app/MainActivity.kt"
      - "app/src/test/java/com/musicflow/app/MusicFlowProTrialTest.kt"
      - ".github/workflows/musicflow-pro-stage1.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android 36
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Assert stage is debug-only and retains stable package
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'applicationId = "com.musicflow.preview"' app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".dev"' app/build.gradle.kts
          grep -F 'ApplicationInfo.FLAG_DEBUGGABLE' app/src/main/java/com/musicflow/app/MainActivity.kt
          grep -F 'feature/musicflow-pro-demo-patch' app/src/main/java/com/musicflow/app/MusicFlowProTrial.kt
          test ! -e app/src/main/assets/pro-license.json
      - name: Run unit tests including signed patch behavior
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build standalone debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify separate package and APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.musicflow.preview.dev'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/MusicFlow-Pro-Stage1-Debug.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-Pro-Stage1-Debug-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error
