name: Publish MusicFlow 0.7.27 verified signed update
on:
  push:
    branches: ["feature/musicflow-v0.7.27-reliable-updates"]
    paths: [".github/workflows/publish-v0727-signed-patch.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: musicflow-release-v0727-signed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact delta and source
        uses: actions/checkout@v4
      - name: Install APK verifier and zstd
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          yes | sdkmanager "build-tools;36.0.0" >/dev/null || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"

      - name: Restore and check original publicly released MusicFlow 0.7.25
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/verified" out
          gh release download v0.7.25 -R "$GITHUB_REPOSITORY" \
            --pattern MusicFlow_0.7.25.apk --dir "$RUNNER_TEMP/baseline"
          echo "5e7a11a0987d68ac1c08665cf7d63c13be06ac88b254a6a61b4e731200428841  $RUNNER_TEMP/baseline/MusicFlow_0.7.25.apk" | sha256sum -c -

      - name: Reconstruct verified signed APK from non-sensitive binary patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PARTS=(.github/release-assets/v0727/part-*.b64)
          test "${#PARTS[@]}" -eq 37
          cat "${PARTS[@]}" | tr -d '\n\r' | base64 -d > "$RUNNER_TEMP/verified/v0727.patch.zst"
          echo "ecc03eb4549ca412eb2019f0a67ec94b9ba8ff5be936c784328da84268318a98  $RUNNER_TEMP/verified/v0727.patch.zst" | sha256sum -c -
          zstd -q -d --patch-from="$RUNNER_TEMP/baseline/MusicFlow_0.7.25.apk" \
            "$RUNNER_TEMP/verified/v0727.patch.zst" -o out/MusicFlow_0.7.27.apk
          echo "02acdef81c7edaf20a3c22084fdb0cfd965a96d6c0c47450ebb66ac63cac616c  out/MusicFlow_0.7.27.apk" | sha256sum -c -

      - name: Verify official package name, version and permanent certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.27.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='727' versionName='0.7.27'"
          SHA=$("$SIGNER" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$SHA" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" || {
            echo "::error::Signer does not match prior MusicFlow releases."
            exit 1
          }
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish signed APK to the GitHub Releases feed used by MusicFlow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.7.27 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Refusing to replace already published v0.7.27."
            exit 1
          fi
          gh release create v0.7.27 out/MusicFlow_0.7.27.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MusicFlow 0.7.27 · встроенное обновление" \
            --notes "Официальный обновляемый APK. Идентификатор com.musicflow.preview, versionCode 727, подписан постоянным ключом MusicFlow с тем же сертификатом, что версии 0.7.22–0.7.25. Проверка, скачивание и запуск установки работают из интерфейса MusicFlow. Отдельная экспериментальная сборка .vktest не может обновиться этим пакетом."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.27" \
            --jq '.assets[].name' | grep -Fx MusicFlow_0.7.27.apk
      - name: Retain published verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.27-verified-published-apk
          path: out/MusicFlow_0.7.27.apk
          retention-days: 30
          if-no-files-found: error
