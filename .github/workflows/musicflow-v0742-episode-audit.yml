name: MusicFlow Cinema episode audit TEST 0.7.42
on:
  push:
    branches: ["feature/musicflow-v0742-episode-audit-recovery"]
    paths:
      - "app/**"
      - ".github/workflows/musicflow-v0742-episode-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run Kotlin tests and assemble APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify audited cinema and test APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/musicflow/app")
          guide=(root/"CinemaEpisodeAudit.kt").read_text()
          search=(root/"CinemaSeriesSearch.kt").read_text()
          screen=(root/"CinemaLabScreen.kt").read_text()
          series=(root/"CinemaRutubeSeries.kt").read_text()
          player=(root/"CinemaNativeInlinePlayer.kt").read_text()
          assert "matchShowId" in guide and "verifiedGuide" in guide
          assert "fun reconcileSeason(" in search
          assert "loadExactEpisode(" in search
          assert "searchEpisodesPages(" in search
          assert "episodeUrl(showId" in series
          assert "CinemaEpisodeAudit.coverage(" in screen
          assert "seriesExpected = " in screen
          assert "не найдена в подключённых источниках" in screen
          assert "seriesExpected: List<CinemaExpectedEpisode>" in player
          print("PASS: metadata-first catalogue and missing-episode flow")
          PY
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview.episodeaudittest42'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/MusicFlow-Cinema-Episode-Audit-TEST-v0.7.42.apk
          sha256sum dist/MusicFlow-Cinema-Episode-Audit-TEST-v0.7.42.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-Cinema-Episode-Audit-TEST-v0742-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error
