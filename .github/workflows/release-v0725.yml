name: MusicFlow 0.7.25 release build and signing
on:
  push:
    branches: ["feature/musicflow-v0.7.25-vk-unified-search"]
    paths: [".github/workflows/release-v0725.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: musicflow-release-0724
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android platform/build tools
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify VK source and in-app updates
        run: python3 scripts/verify_v0725.py
      - name: Check permanent release signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICFLOW_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MUSICFLOW_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MUSICFLOW_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MUSICFLOW_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing secrets not configured. Unsigned APK will be exported for offline signing with the 0.7.22 key."
          else
            printf "%s" "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/musicflow-release.jks"
            chmod 600 "$RUNNER_TEMP/musicflow-release.jks"
            echo "MUSICFLOW_SIGNING_KEYSTORE=$RUNNER_TEMP/musicflow-release.jks" >> "$GITHUB_ENV"
            echo "MUSICFLOW_SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "MUSICFLOW_SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "MUSICFLOW_SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compile MusicFlow 0.7.25 release
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare release and Android signer tools
        run: |
          set -euo pipefail
          mkdir -p signing_inputs
          if [[ -f "app/build/outputs/apk/release/app-release.apk" ]]; then
            cp "app/build/outputs/apk/release/app-release.apk" signing_inputs/MusicFlow_0.7.25.apk
          else
            cp "app/build/outputs/apk/release/app-release-unsigned.apk" signing_inputs/MusicFlow_0.7.25-unsigned.apk
          fi
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" signing_inputs/
          cp "$ANDROID_HOME/build-tools/36.0.0/zipalign" signing_inputs/
          ls -lh signing_inputs/
      - name: Verify certificate, if signed
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose signing_inputs/MusicFlow_0.7.25.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging signing_inputs/MusicFlow_0.7.25.apk | grep "name='com.musicflow.preview' versionCode='724'"
      - name: Upload APK and signing tools
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.25-release-outputs
          path: signing_inputs/
          if-no-files-found: error
          retention-days: 30
      - name: Publish official update in GitHub Releases
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.25 >/dev/null 2>&1; then
            echo "::error::Version 0.7.25 has already been published. Never replace a signed release."
            exit 1
          fi
          gh release create v0.7.25 signing_inputs/MusicFlow_0.7.25.apk --title "MusicFlow 0.7.25" \
            --target "$GITHUB_SHA" \
            --notes "Поиск VK Музыки встроен в общий поиск MusicFlow, а отдельная вкладка VK удалена. Результаты открываются через официальный веб-интерфейс VK; собственный плеер MusicFlow и другие источники сохранены. Эта версия подписана постоянным ключом 0.7.22–0.7.23."
