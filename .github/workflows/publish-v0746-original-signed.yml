name: Publish MusicFlow 0.7.46 original-key IPTV update
on:
  push:
    branches: ["feature/musicflow-v0746-tv-hls-buffer-resilience"]
    paths:
      - ".github/release-assets/v0746/signed-delta.doublezstd.b64"
permissions:
  contents: write
  actions: read
concurrency:
  group: official-musicflow-v0746
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare APK signature verification
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || { sudo apt-get update -qq && sudo apt-get install -y zstd; }
          yes | sdkmanager "build-tools;36.0.0" >/dev/null ||
            test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Download tested original unsigned APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/release-assets/v0746/checksums.env
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 45052715991 -R "$GITHUB_REPOSITORY" \
            -n MusicFlow-0.7.46-aligned-unsigned \
            --dir "$RUNNER_TEMP/unsigned"
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.46-unsigned.apk"
          echo "$UNSIGNED_SHA  $UNSIGNED" | sha256sum -c -
          SOURCE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/45052715991" \
            --jq '.head_sha')
          test "$SOURCE" = "$SOURCE_SHA" || {
            echo "::error::Signed APK source mismatch."
            exit 1
          }
      - name: Reconstruct privately signed release from nonsecret signed-byte delta
        shell: bash
        run: |
          set -euo pipefail
          source .github/release-assets/v0746/checksums.env
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.46-unsigned.apk"
          OUTER="$RUNNER_TEMP/signed-delta.doublezstd"
          PATCH="$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          base64 -d .github/release-assets/v0746/signed-delta.doublezstd.b64 > "$OUTER"
          echo "$OUTER_SHA  $OUTER" | sha256sum -c -
          zstd -q -d "$OUTER" -o "$PATCH"
          echo "$PATCH_SHA  $PATCH" | sha256sum -c -
          zstd -q -d --patch-from="$UNSIGNED" "$PATCH" \
            -o out/MusicFlow_0.7.46.apk
          echo "$SIGNED_SHA  out/MusicFlow_0.7.46.apk" | sha256sum -c -
      - name: Verify unchanged app identity and release certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.46.apk
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -c -p 4 "$APK"
          "$TOOLS/apksigner" verify --verbose --min-sdk-version 26 "$APK"
          "$TOOLS/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='746' versionName='0.7.46'"
          CERT=$("$TOOLS/apksigner" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$CERT" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410" ||
            { echo "::error::Wrong signing certificate"; exit 1; }
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish official 0.7.46 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.46 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v0.7.46 already exists; refusal to overwrite"
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          MusicFlow 0.7.46 — повышенная устойчивость IPTV при медленном интернете.

          - Анализ пользовательского M3U: 3244 уникальных HLS-потока с одним исходным серверным доменом (без публикации приватных адресов).
          - Media3: расширенный буфер 25–75 секунд, старт после 6 секунд и возобновление после 12 секунд; ограничение буфера до 64 MiB.
          - HTTP: ожидание подключения до 20 секунд, чтения данных до 45 секунд.
          - ТВ-восстановление: ожидание буферизации до 65 секунд, проверка остановившейся позиции через 30 секунд, не более двух повторных подключений.
          - Ошибки 401/403/404 не ретраятся, поскольку буфер их не устраняет.
          - Сохранены пять тем Liquid Glass, эквалайзер, радио, кино и механизм обновления.

          Важно: фактическая скорость, доступность сегментов и качество вещания
          должны проверяться в сети пользователя. Большой буфер помогает при
          кратковременной нестабильности, но не преодолевает постоянный недостаток
          скорости для HD/FHD/4K или ограничения сервера.

          Сборка: com.musicflow.preview, versionCode 746, 0.7.46.
          Оригинальная подпись MusicFlow для обновления поверх 0.7.45 без удаления.
          NOTES
          gh release create v0.7.46 out/MusicFlow_0.7.46.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "MusicFlow 0.7.46 · IPTV буфер и ожидание" \
            --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.46" \
            --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.46.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.46-official-signed
          path: |
            out/MusicFlow_0.7.46.apk
            out/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
