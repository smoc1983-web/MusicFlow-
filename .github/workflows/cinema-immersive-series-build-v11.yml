name: Build Cinema TEST v11 immersive fullscreen and episodes search

on:
  push:
    branches: ["feature/musicflow-cinema-series-search-scroll-v11"]
    paths: [".github/workflows/cinema-immersive-series-build-v11.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify immersive behavior, episode search and scroll-to-top
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/musicflow/app")
          player=(root/"CinemaNativeInlinePlayer.kt").read_text()
          screen=(root/"CinemaLabScreen.kt").read_text()
          search=(root/"CinemaSeriesSearch.kt").read_text()
          gradle=Path("app/build.gradle.kts").read_text()
          manifest=Path("app/src/main/AndroidManifest.xml").read_text()
          assert 'applicationIdSuffix = ".cinematest11"' in gradle
          assert 'MusicFlow Кино TEST v11' in manifest
          assert 'WindowInsetsCompat.Type.systemBars()' in player
          assert 'hideCinemaSystemBars(window)' in player
          assert 'showCinemaSystemBars(window)' in player
          assert 'dialogWindow?.let(::hideCinemaSystemBars)' in player
          assert 'dialogWindow?.let(::showCinemaSystemBars)' in player
          assert 'SCREEN_ORIENTATION_PORTRAIT' in player
          assert 'BackHandler(enabled = fullScreen)' in player
          assert 'CinemaPlayerSeasonsDialog' in player
          assert 'state = listState' in player
          assert 'rememberLazyListState()' in screen
          assert 'catalogListState.scrollToItem(0)' in screen
          assert 'state = catalogListState' in screen
          assert 'CinemaSeriesSearch.lookup(' in screen
          assert 'CinemaSeriesSearch.fallbackShow(' in screen
          assert 'CinemaSeriesSearch.inSeason(' in screen
          assert 'titleFamily' not in screen
          assert 'CinemaRutubeCatalog.search(' in search
          assert 'CinemaRutubeSeries.loadShowFor(videoId)' in search
          print("PASS: immersive system bars, orientation restore, source-wide seasons, scroll reset")
          PY
      - name: Run Kotlin tests and compile APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify package, debug signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview.cinematest11'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/MusicFlow-Cinema-TEST-v11.apk
          sha256sum dist/MusicFlow-Cinema-TEST-v11.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-Cinema-TEST-v11-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error
