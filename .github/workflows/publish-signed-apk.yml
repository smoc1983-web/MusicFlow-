name: Publish signed MusicFlow APK
on:
  # Specialized release job handles automatic publication and certificate guards.
  # Keep this generic legacy publisher manual to avoid duplicate tag-triggered jobs.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MUSICFLOW_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MUSICFLOW_SIGNING_STORE_PASSWORD }}
          ALIAS: ${{ secrets.MUSICFLOW_SIGNING_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MUSICFLOW_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASS" || -z "$ALIAS" || -z "$KEY_PASS" ]]; then
            echo "::error::Configure the four MUSICFLOW_SIGNING_* repository secrets before publishing."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/musicflow-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "MUSICFLOW_SIGNING_KEYSTORE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "MUSICFLOW_SIGNING_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep "name='com.musicflow.preview'"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          TAG="v$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Git tag and versionName differ."
            exit 1
          fi
          ASSET="MusicFlow_$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release exists; never overwrite signed APK with same version."
            exit 1
          fi
          gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" \
            --title "MusicFlow $VERSION" \
            --notes "Подписанная версия MusicFlow. Проверка обновлений: меню → О приложении. Обновления проверяются внутри MusicFlow и устанавливаются через системный установщик Android. Подпись APK должна совпадать с установленной версией."