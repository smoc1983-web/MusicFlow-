name: Build MusicFlow 0.7.28 release for local signing
# Compile release from first-party VK portal source after test correction.
on:
  push:
    branches: ["feature/musicflow-v0.7.28-vk-login-playprotect"]
    paths: [".github/workflows/build-v0728-unsigned.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify first-party VK integration
        run: python3 scripts/verify_v0728.py
      - name: Build Android release APK without signing
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify official application ID, version and zipalign APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='728' versionName='0.7.28'"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$APK" dist/MusicFlow_0.7.28-aligned-unsigned.apk
          sha256sum dist/MusicFlow_0.7.28-aligned-unsigned.apk > dist/UNSIGNED_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.28-unsigned
          path: dist/
          retention-days: 30
          if-no-files-found: error
