name: Verify experimental native VK integration
on:
  push:
    branches:
      - "feature/musicflow-v0.7.26-vk-native-authorized"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-vk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Native VK integration assertions
        run: python3 scripts/verify_v0726.py
      - name: Compile Android Debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload experimental APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-v0726-vk-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
