name: Research RUTUBE film and series API schemas v8
on:
  push:
    branches: ["feature/musicflow-cinema-rutube-discovery-v8"]
    paths: [".github/workflows/cinema-rutube-schema-v8.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect genre tabs, video metadata, search and TV show schemas
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,re
          BASE="https://rutube.ru"
          HEAD={"User-Agent":"Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36","Referer":BASE+"/","Accept":"application/json"}
          def fetch(url):
              request=urllib.request.Request(url,headers=HEAD)
              with urllib.request.urlopen(request,timeout=12) as response:
                  body=response.read(1800000)
                  return json.loads(body)
          def safe(url):
              p=urllib.parse.urlsplit(urllib.parse.urljoin(BASE,url))
              return p.scheme=="https" and p.hostname in ("rutube.ru","www.rutube.ru") and p.path.startswith("/api/")
          def details(a):
              if not isinstance(a,dict):return {"type":str(type(a))}
              return {k:(
                  str(v)[:130] if not isinstance(v,(dict,list)) else
                  list(v)[:12] if isinstance(v,dict) else "list:"+str(len(v)))
                  for k,v in a.items() if k in [
                      "id","title","name","name_displayed","url","next","has_next","page","results","video_balancer",
                      "season","episode","series","tv","tv_show","metainfo","genre","genres",
                      "category","duration","thumbnail_url","picture_url","description","seasons",
                      "content_type","slug","type","video","poster_picture","is_hidden","is_paid"]}
          try:
              feed=fetch(BASE+"/api/feeds/movies?format=json")
              tabs=feed.get("tabs",[])
              print("FEED_TABS",len(tabs))
              for tab in tabs[:16]:
                  print("TAB",tab.get("name"),"resources",len(tab.get("resources",[])),"slug",tab.get("slug"))
                  for res in tab.get("resources",[])[:2]:
                      print(" RESOURCE",details(res))
              tested=0
              for tab in tabs[:12]:
                  for resource in tab.get("resources",[])[:2]:
                      u=resource.get("url")
                      if not u or not safe(u) or tested>=7:continue
                      tested+=1
                      try:
                          j=fetch(urllib.parse.urljoin(BASE,u))
                          print("RESOURCE_RESULTS",tab.get("name"),"COUNT",len(j.get("results",[])),"NEXT",bool(j.get("next")),"SCHEMA",list(j)[:12])
                          for item in j.get("results",[])[:2]:
                              print(" ITEM",details(item))
                      except Exception as e:print(" RESOURCE_FAIL",type(e).__name__,str(e)[:100])
          except Exception as e:print("FEED_FAIL",type(e).__name__,str(e)[:160])
          try:
              j=fetch(BASE+"/api/search/video/?query="+urllib.parse.quote("сериал")+"&page=1&limit=5")
              print("SEARCH_SCHEMA",list(j)[:20],"COUNT",len(j.get("results",[])))
              for item in j.get("results",[])[:2]:print(" SEARCH_ITEM",details(item))
          except Exception as e:print("SEARCH_FAIL",type(e).__name__,str(e)[:160])
          for endpoint in ["/api/metainfo/tv/28/","/api/metainfo/tv/28/video?season=1&sort=series_a","/api/video/1dcc35d6575bc881dc2ece8c1efcdc35/"]:
              try:
                  j=fetch(BASE+endpoint)
                  print("TV_ENDPOINT",endpoint,"KEYS",list(j)[:30])
                  if "results" in j:
                      for item in j["results"][:2]:print("  TV_ITEM",details(item))
                  else:print("  TV_META",details(j))
              except Exception as e:print("TV_FAIL",endpoint,type(e).__name__,str(e)[:160])
          PY
