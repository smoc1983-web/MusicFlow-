name: Build MusicFlow 0.7.40 aligned unsigned APK for original-key signing
on:
  push:
    branches: ["feature/musicflow-v0.7.40-tv-hub-plugins"]
    paths: [".github/workflows/build-v0740-unsigned-for-local-signing.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android tools
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Verify version, TV integration, security boundaries and Kotlin tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_v0730.py
          python3 scripts/verify_v0739_radio.py
          python3 scripts/verify_v0740_tv.py
          grep -F 'instanceFollowRedirects = !fromPlugin' app/src/main/java/com/musicflow/app/UserIptvSources.kt
          grep -Fx '        applicationId = "com.musicflow.preview"' app/build.gradle.kts
          grep -Fx '        versionCode = 740' app/build.gradle.kts
          grep -Fx '        versionName = "0.7.40"' app/build.gradle.kts
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Align and verify unsigned release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          INPUT="app/build/outputs/apk/release/app-release-unsigned.apk"
          APK="dist/MusicFlow_0.7.40-aligned-unsigned.apk"
          test -s "$INPUT"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$INPUT" "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='740' versionName='0.7.40'"
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/apksigner.jar
          sha256sum "$APK" > dist/UNSIGNED_SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.40-aligned-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 30
