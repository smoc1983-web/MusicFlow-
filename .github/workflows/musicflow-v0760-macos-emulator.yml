name: MusicFlow TEST 0.7.60 macOS accelerated emulator music sources and radio UI
on:
  push:
    branches: ["feature/musicflow-cinema-quality-radio-controls-v0761"]
    paths:
      - ".github/workflows/musicflow-v0760-macos-emulator.yml"
      - ".github/scripts/musicflow-v0760-emulator.sh"
      - "app/src/androidTest/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrumented-emulator:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile TEST app and real Android instrumentation APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Android 14 accelerated Intel emulator - music sources and radio UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          disk-size: 6G
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/musicflow-v0760-emulator.sh
      - name: Upload source statuses and radio screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.60-macos-android-emulator-evidence
          path: emulator-evidence/
          retention-days: 30
          if-no-files-found: warn
