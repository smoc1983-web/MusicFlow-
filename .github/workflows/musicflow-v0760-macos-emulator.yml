name: MusicFlow TEST 0.7.60 macOS accelerated emulator music sources and radio UI
on:
  push:
    branches: ["feature/musicflow-cinema-quality-radio-controls-v0761"]
    paths:
      - ".github/workflows/musicflow-v0760-macos-emulator.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  instrumented-emulator:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile TEST app and real Android instrumentation APK
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Android 14 accelerated Intel emulator - music sources and radio UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          disk-size: 6G
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            mkdir -p emulator-evidence
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class 'com.musicflow.app.MusicSourcesEmulatorTest,com.musicflow.app.DashVideoQualityTest' com.musicflow.preview.dev.test/androidx.test.runner.AndroidJUnitRunner > emulator-evidence/instrumentation.txt 2>&1 || echo 'Instrumentation command failed' >> emulator-evidence/instrumentation.txt
            cat emulator-evidence/instrumentation.txt | tail -n 100
            adb logcat -d -s MUSICFLOW_SOURCE_PROBE:I '*:S' > emulator-evidence/provider-diagnostics.log || true
            adb exec-out run-as com.musicflow.preview.dev cat /sdcard/Android/data/com.musicflow.preview.dev/files/source-probe-v0760.txt > emulator-evidence/source-probe-v0760.txt || true
            adb exec-out run-as com.musicflow.preview.dev cat /sdcard/Android/data/com.musicflow.preview.dev/files/musicflow-radio-list-v0760.png > emulator-evidence/musicflow-radio-list-v0760.png || true
            adb exec-out run-as com.musicflow.preview.dev cat /sdcard/Android/data/com.musicflow.preview.dev/files/musicflow-radio-player-v0760.png > emulator-evidence/musicflow-radio-player-v0760.png || true
            test -s emulator-evidence/instrumentation.txt
            grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|FAILURE|Instrumentation command failed' emulator-evidence/instrumentation.txt && exit 1 || true
            grep -Eq 'OK \([1-9][0-9]* tests?\)' emulator-evidence/instrumentation.txt
      - name: Upload source statuses and radio screenshots even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.60-macos-android-emulator-evidence
          path: emulator-evidence/
          retention-days: 30
          if-no-files-found: warn
