name: Publish MusicFlow 0.7.39 original-key signed radio catalog update
on:
  push:
    branches: ["feature/musicflow-v0.7.39-radio-catalog-recovery"]
    paths: [".github/release-assets/v0739/signed-delta.doublezstd.b64"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: musicflow-v0739-verified-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact signed-delta manifest
        uses: actions/checkout@v4
      - name: Prepare zstd and Android signing verification tools
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y zstd
          fi
          yes | sdkmanager "build-tools;36.0.0" >/dev/null || test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
      - name: Download precisely verified 0.7.39 unsigned release artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unsigned" out
          gh run download 44981423044 -R "$GITHUB_REPOSITORY" \
            -n MusicFlow-0.7.39-aligned-unsigned --dir "$RUNNER_TEMP/unsigned"
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.39-aligned-unsigned.apk"
          echo "23a3d006974febb0df8f338fb192bb5508072ae2c2237818e1e5a70744afa2fd  $UNSIGNED" | sha256sum -c -
      - name: Reconstruct privately signed APK from public binary difference
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$RUNNER_TEMP/unsigned/MusicFlow_0.7.39-aligned-unsigned.apk"
          PATCH="$RUNNER_TEMP/unsigned-to-signed.patch.zst"
          OUTER="$RUNNER_TEMP/signed-delta.doublezstd"
          base64 -d .github/release-assets/v0739/signed-delta.doublezstd.b64 > "$OUTER"
          echo "ff92908195b81ae6a10c68b0deef024d247db4acd6451a68a601f5bd984f7d29  $OUTER" | sha256sum -c -
          zstd -q -d "$OUTER" -o "$PATCH"
          echo "01153d9512aafbcdbfc54c60d019b7bd415202155c378762625688f4a9b9621b  $PATCH" | sha256sum -c -
          zstd -q -d --patch-from="$UNSIGNED" "$PATCH" -o out/MusicFlow_0.7.39.apk
          echo "9d743a1f0b755aab95e3f61bde7f35a32cf04b9c58e183e895cf17e4bc05c5f4  out/MusicFlow_0.7.39.apk" | sha256sum -c -
      - name: Validate original signing certificate, APK contents, version and archive
        shell: bash
        run: |
          set -euo pipefail
          APK=out/MusicFlow_0.7.39.apk
          SIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          "$ZIPALIGN" -c -p 4 "$APK"
          "$SIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" |
            grep -F "name='com.musicflow.preview' versionCode='739' versionName='0.7.39'"
          FINGERPRINT=$("$SIGNER" verify --print-certs "$APK" |
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
          test "$FINGERPRINT" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410"
          unzip -Z1 "$APK" | grep -Fx 'assets/radio_russia_fallback.m3u'
          sha256sum "$APK" > out/SHA256SUMS.txt
      - name: Publish only if v0.7.39 does not exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.39 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v0.7.39 already exists; refusing to overwrite."
            exit 1
          fi
          cat > out/RELEASE_NOTES.md <<'NOTES'
          MusicFlow 0.7.39 — восстановление радиостанций.

          - Исправлено отсутствие общего списка российских радиостанций при сбоях DNS и недоступности зеркал Radio Browser.
          - Добавлен независимый резервный каталог из GitHub и встроенный список из 300 станций для отображения без подключения к каталогу.
          - Убрана чрезмерная зависимость списка от сторонних статусов доступности и добавлено сохранение последнего успешного каталога.
          - Сохранены поиск радиостанций, избранное, штатный плеер и другие возможности MusicFlow.
          - Исправлено отображение номера сборки в диагностике.
          - Package: com.musicflow.preview, versionName: 0.7.39, versionCode: 739. Подпись исходным ключом MusicFlow.

          Обновление: MusicFlow → О приложении → Проверить обновления. Подтвердите установку системным установщиком Android.
          Источники онлайн-радио являются внешними: отображение станции не гарантирует, что её поток доступен в конкретной сети.
          Тестовая функция Pro не включена и не затронута.
          NOTES
          gh release create v0.7.39 out/MusicFlow_0.7.39.apk out/SHA256SUMS.txt \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "MusicFlow 0.7.39 · Исправление радио" --notes-file out/RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.39" \
            --jq '.assets[].name' | grep -Fx 'MusicFlow_0.7.39.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.39-official-signed
          path: |
            out/MusicFlow_0.7.39.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
