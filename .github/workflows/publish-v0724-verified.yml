name: Publish verified MusicFlow 0.7.24 update
on:
  push:
    branches: ["feature/musicflow-v0.7.24-publish-update"]
    paths: [".github/workflows/publish-v0724-verified.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: musicflow-release-v0724-verified
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ensure decompression tools
        run: |
          set -euo pipefail
          if ! command -v zstd >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y zstd; fi
      - name: Download original unsigned 0.7.24 from successful source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/musicflow-source" "$RUNNER_TEMP/release"
          gh run download 44877444174 -R "$GITHUB_REPOSITORY" -n MusicFlow-0.7.24-release-outputs -D "$RUNNER_TEMP/musicflow-source"
          test -s "$RUNNER_TEMP/musicflow-source/MusicFlow_0.7.24-unsigned.apk"
          echo "973cc6fda3792ddbf5fa1dde1d869c4bef1877a199abfdd368a6685a8747442a  $RUNNER_TEMP/musicflow-source/MusicFlow_0.7.24-unsigned.apk" | sha256sum -c -
      - name: Restore exact already signed APK without exposing signing key
        run: |
          set -euo pipefail
          base64 -d .github/release-assets/v0724-unsigned-to-signed.zst.b64 > "$RUNNER_TEMP/musicflow-v0724.patch.zst"
          zstd -d -q --patch-from="$RUNNER_TEMP/musicflow-source/MusicFlow_0.7.24-unsigned.apk" \
            "$RUNNER_TEMP/musicflow-v0724.patch.zst" -o "$RUNNER_TEMP/release/MusicFlow_0.7.24.apk"
          echo "11a278b09d3bdd678c6ad44b19619bb46c7c1ad77f09fcc4827a6f7417a2b211  $RUNNER_TEMP/release/MusicFlow_0.7.24.apk" | sha256sum -c -
      - name: Verify Android package and permanent signing certificate
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" >/dev/null || true
          APK="$RUNNER_TEMP/release/MusicFlow_0.7.24.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$APKSIGNER" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose "$APK"
          SIGNER="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | sed -n '1p')"
          test "$SIGNER" = "c461ee635d5b295ef6c765e1ae533d0079dc6e53cb2632a11a1b445773752410"
          "$AAPT" dump badging "$APK" | grep "name='com.musicflow.preview' versionCode='724' versionName='0.7.24'"
      - name: Publish APK to MusicFlow in-app update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.24 -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v0.7.24 already exists; refusing to overwrite an official signed APK."
            exit 1
          fi
          gh release create v0.7.24 "$RUNNER_TEMP/release/MusicFlow_0.7.24.apk" \
            -R "$GITHUB_REPOSITORY" --target 33ef6e4dd134c179cac0d5c54fb0745f6d013a71 \
            --title "MusicFlow 0.7.24" \
            --notes "Официальное обновление для MusicFlow 0.7.22 и 0.7.23. Добавлен раздел VK Музыка с официальным веб-плеером. APK проверен по SHA-256 и подписан постоянным ключом MusicFlow; установка выполняется через встроенный механизм обновлений Android."
      - name: Confirm published download is visible in GitHub Releases API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.24" --jq '.assets[].name' | grep -Fx "MusicFlow_0.7.24.apk"
      - name: Upload verified signed APK as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-0.7.24-verified-published
          path: "${{ runner.temp }}/release/MusicFlow_0.7.24.apk"
          if-no-files-found: error
          retention-days: 30
