name: Build Cinema TEST v12 episodes and audio

on:
  push:
    branches: ["feature/musicflow-cinema-episodes-audio-v12"]
    paths:
      - ".github/workflows/cinema-episodes-voice-build-v12.yml"
      - "app/src/main/java/com/musicflow/app/Cinema*.kt"
      - "app/src/test/java/com/musicflow/app/Cinema*.kt"
      - "app/build.gradle.kts"
      - "app/src/main/AndroidManifest.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        shell: bash
        run: |
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || test -d "$ANDROID_HOME/platforms/android-36"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Test and assemble
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Verify isolated package, debug signature and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" |
            grep -F "name='com.musicflow.preview.cinematest12'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p dist
          cp "$APK" dist/MusicFlow-Cinema-TEST-v12.apk
          sha256sum dist/MusicFlow-Cinema-TEST-v12.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MusicFlow-Cinema-TEST-v12-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error
